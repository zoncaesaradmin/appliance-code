openapi: 3.1.0
info:
  title: Zon Appliance Control Plane API
  version: 0.1.0
  description: >
    REST contract for appliance control-plane APIs used by browser UI,
    CLI, SDKs, and automation clients. The React SPA calls this contract
    directly from the browser; UI static asset routes are intentionally not
    part of this API contract.
servers:
  - url: https://appliance.local
security:
  - bearerAuth: []
paths:
  /api/v1/setup/status:
    get:
      summary: Get appliance setup status
      description: >
        Returns whether the appliance has already been initialized with a first
        administrator account. Available on every profile and does not require
        authentication.
      operationId: getSetupStatus
      security: []
      responses:
        "200":
          description: Setup status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
  /api/v1/capabilities:
    get:
      summary: List enabled appliance capabilities
      description: >
        Returns the resolved capability set for the running appliance instance.
        Browser clients should gate visible navigation and pages on these
        capabilities instead of duplicating profile-to-capability mapping.
      operationId: listCapabilities
      security: []
      responses:
        "200":
          description: Enabled capabilities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesResponse"
  /api/v1/setup/first-admin:
    post:
      summary: Create the first administrator
      description: >
        Creates the first local administrator when the appliance is not yet
        initialized. Available without authentication until initialization is
        complete.
      operationId: createFirstAdmin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFirstAdminRequest"
      responses:
        "201":
          description: First administrator created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateFirstAdminResponse"
        "400":
          $ref: "#/components/responses/ValidationProblem"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/auth/login:
    post:
      summary: Log in with appliance credentials
      description: >
        Authenticates against an authentication domain. V1 supports only
        `local` (the appliance-local user store). The `domain` field may be
        omitted or sent as an empty string; both are treated as `local`.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/ValidationProblem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "423":
          description: Account temporarily locked.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/auth/refresh:
    post:
      summary: Refresh an interactive session
      operationId: refreshSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Refreshed session credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/ValidationProblem"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/logout:
    post:
      summary: Log out the current interactive session
      operationId: logout
      responses:
        "204":
          description: Logged out.
        "400":
          description: Presented credential is not an interactive session.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/session:
    get:
      summary: Get the current authenticated session
      operationId: getSession
      responses:
        "200":
          description: Current session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/appliance/identity:
    get:
      summary: Get appliance LAN identity
      description: >
        Returns the product LAN identity for this appliance instance:
        applianceName, dnsZone, derived FQDN, node IPv4, and canonicalOrigin.
        Available on every profile (base capability). Install does not publish
        DNS; operators use this response to register an A record on landns.
      operationId: getApplianceIdentity
      security: []
      responses:
        "200":
          description: Appliance identity.
          content:
            application/json:
              schema:
                type: object
                required: [applianceName, dnsZone, fqdn]
                properties:
                  applianceName:
                    type: string
                    example: registry1
                  dnsZone:
                    type: string
                    example: appliance.internal
                  fqdn:
                    type: string
                    example: registry1.appliance.internal
                  nodeIPv4:
                    type: string
                    example: 192.168.1.102
                  canonicalOrigin:
                    type: string
                    example: https://registry1.appliance.internal
  /api/v1/dns/publish:
    post:
      summary: Publish a DNS name to a remote DNS appliance
      description: >
        Base-capability helper available on every appliance profile. The local
        control plane calls PUT /api/v1/dns/records/{name} on the remote
        DNS-bearing appliance (landns / storage-landns / builder-landns / builder-storage-landns) using the supplied API token.
        Installers never write DNS records; use this API or call the DNS
        appliance records API directly. Requires dns.publish.
      operationId: publishDNSRecord
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dnsApplianceURL, apiToken, name, ipv4]
              properties:
                dnsApplianceURL:
                  type: string
                  example: https://192.168.1.101
                apiToken:
                  type: string
                  description: Bearer token with dns.records.register (or write) on the remote DNS appliance.
                name:
                  type: string
                  example: registry1
                  description: Single left-hand label under appliance.internal.
                ipv4:
                  type: string
                  example: 192.168.1.102
                ttl:
                  type: integer
                  example: 60
                owner:
                  type: string
                  description: Defaults to the authenticated principal user id.
      responses:
        "200":
          description: Remote DNS appliance accepted the record.
          content:
            application/json:
              schema:
                type: object
                required: [name, ipv4]
                properties:
                  name:
                    type: string
                  ipv4:
                    type: string
        "400":
          description: Invalid request body.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          description: Remote DNS appliance rejected or was unreachable.
  /api/v1/dns/records:
    get:
      summary: List LAN DNS A records
      description: >
        Lists A records in the appliance.internal zone. Requires the dns
        capability and dns.records.read. Available on DNS-bearing profiles only.
      operationId: listDNSRecords
      responses:
        "200":
          description: DNS records.
          content:
            application/json:
              schema:
                type: object
                required: [zone, items]
                properties:
                  zone:
                    type: string
                    example: appliance.internal
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DNSRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: dns capability disabled on this appliance.
  /api/v1/dns/records/{name}:
    put:
      summary: Create or update a LAN DNS A record
      description: >
        Upserts one left-hand label under appliance.internal. Administrators
        use dns.records.write; peer appliances use dns.records.register and
        may only renew names they own (lease-based).
      operationId: upsertDNSRecord
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            example: registry1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ipv4]
              properties:
                ipv4:
                  type: string
                  example: 192.168.1.102
                ttl:
                  type: integer
                  example: 300
                owner:
                  type: string
                  description: Required for peer registration; must match the authenticated principal.
      responses:
        "200":
          description: Upserted record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DNSRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Ownership conflict.
    delete:
      summary: Delete a LAN DNS A record
      operationId: deleteDNSRecord
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Record not found or dns capability disabled.
  /api/v1/work-profiles:
    get:
      summary: List workspace profiles
      description: Lists configured workspace profiles for builder workflows.
      operationId: listWorkProfiles
      responses:
        "200":
          description: Workspace profiles.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/builder/git-access:
    get:
      summary: Get shared builder Git access status
      description: >
        Returns whether the appliance-wide HTTPS Git credential required for
        builder workspace provisioning and build flows has been configured.
      operationId: getBuilderGitAccess
      responses:
        "200":
          description: Builder Git access status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderGitAccessStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      summary: Configure shared builder Git access
      description: >
        Stores the appliance-wide HTTPS Git credential used by builder
        workflows when cloning configured repositories.
      operationId: updateBuilderGitAccess
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBuilderGitAccessRequest"
      responses:
        "200":
          description: Updated builder Git access status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderGitAccessStatus"
        "400":
          $ref: "#/components/responses/ValidationProblem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/workspaces:
    get:
      summary: List workspaces
      operationId: listWorkspaces
      responses:
        "200":
          description: Workspaces visible to the caller.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: Create workspace
      description: Creates one logical workspace from a workspace profile and makes it current for the caller. The workspace profile determines the repos available inside that workspace.
      operationId: createWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceRequest"
      responses:
        "201":
          description: Created workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/ValidationProblem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/workspaces/{workspaceId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
    get:
      summary: Get workspace
      operationId: getWorkspace
      responses:
        "200":
          description: Workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete workspace
      operationId: deleteWorkspace
      responses:
        "204":
          description: Workspace deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/current-workspace:
    get:
      summary: Get current workspace
      operationId: getCurrentWorkspace
      responses:
        "200":
          description: Current workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      summary: Set current workspace
      operationId: setCurrentWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspaceId]
              properties:
                workspaceId:
                  type: string
      responses:
        "200":
          description: Current workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/ValidationProblem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/current-workspace/build-targets:
    get:
      summary: List build targets for current workspace
      operationId: listCurrentWorkspaceBuildTargets
      responses:
        "200":
          description: Build targets.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/BuildTarget"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/current-workspace/builds:
    post:
      summary: Submit build for current workspace
      operationId: submitCurrentWorkspaceBuild
      parameters:
        - in: header
          name: Idempotency-Key
          schema:
            type: string
          required: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitBuildRequest"
      responses:
        "201":
          description: Build job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/ValidationProblem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/current-workspace/build-status:
    get:
      summary: Get current workspace build status
      operationId: getCurrentWorkspaceBuildStatus
      responses:
        "200":
          description: Latest current-workspace build job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/tokens:
    get:
      summary: List the caller's API tokens
      operationId: listSelfTokens
      responses:
        "200":
          description: Tokens owned by the caller.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/APIToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: Create an API token for the caller
      operationId: createSelfToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenRequest"
      responses:
        "201":
          description: Token created. The raw token value is returned only once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTokenResponse"
        "400":
          $ref: "#/components/responses/ValidationProblem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/tokens/{id}:
    parameters:
      - $ref: "#/components/parameters/TokenID"
    delete:
      summary: Revoke an API token
      operationId: revokeSelfToken
      responses:
        "204":
          description: Token revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/registry/grants:
    get:
      summary: List registry grants
      operationId: listRegistryGrants
      responses:
        "200":
          description: Explicit registry grants.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/RegistryGrant"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: Create a registry grant
      operationId: createRegistryGrant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRegistryGrantRequest"
      responses:
        "201":
          description: Created registry grant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistryGrant"
        "400":
          $ref: "#/components/responses/ValidationProblem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/registry/grants/{id}:
    parameters:
      - $ref: "#/components/parameters/GrantID"
    delete:
      summary: Delete a registry grant
      operationId: deleteRegistryGrant
      responses:
        "204":
          description: Grant deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/registry/repositories:
    get:
      summary: List visible registry repositories
      operationId: listRegistryRepositories
      responses:
        "200":
          description: Repositories visible to the caller.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/registry/repositories/{repositoryPath}/tags:
    parameters:
      - $ref: "#/components/parameters/RepositoryPath"
    get:
      summary: List tags for a repository
      description: >
        Repository paths are multi-segment names as returned by the repository
        list. Clients should preserve the repository path exactly when building
        this request path.
      operationId: listRegistryTags
      responses:
        "200":
          description: Repository tags.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: string
        "400":
          $ref: "#/components/responses/ValidationProblem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/registry/repositories/{repositoryPath}/referrers:
    parameters:
      - $ref: "#/components/parameters/RepositoryPath"
    get:
      summary: List referrers for a repository manifest
      operationId: listRegistryReferrers
      parameters:
        - in: query
          name: digest
          required: true
          schema:
            type: string
          description: Subject manifest digest.
      responses:
        "200":
          description: Repository referrers.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/RegistryDescriptor"
        "400":
          $ref: "#/components/responses/ValidationProblem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/jobs:
    get:
      summary: List jobs
      operationId: listJobs
      responses:
        "200":
          description: Jobs visible to the caller.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/jobs/{jobId}:
    parameters:
      - $ref: "#/components/parameters/JobID"
    get:
      summary: Get job
      operationId: getJob
      responses:
        "200":
          description: Job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/jobs/{jobId}/cancel:
    parameters:
      - $ref: "#/components/parameters/JobID"
    post:
      summary: Cancel job
      operationId: cancelJob
      responses:
        "200":
          description: Cancelled job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/jobs/{jobId}/steps:
    parameters:
      - $ref: "#/components/parameters/JobID"
    get:
      summary: List job steps
      operationId: listJobSteps
      responses:
        "200":
          description: Job steps.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/JobStep"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/jobs/{jobId}/logs:
    parameters:
      - $ref: "#/components/parameters/JobID"
    get:
      summary: Get job logs
      operationId: getJobLogs
      responses:
        "200":
          description: Job logs.
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    WorkspaceID:
      in: path
      name: workspaceId
      required: true
      schema:
        type: string
    JobID:
      in: path
      name: jobId
      required: true
      schema:
        type: string
    TokenID:
      in: path
      name: id
      required: true
      schema:
        type: string
    GrantID:
      in: path
      name: id
      required: true
      schema:
        type: string
    RepositoryPath:
      in: path
      name: repositoryPath
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Authentication required.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Permission denied.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource not found.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Request conflicts with current resource state.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ValidationProblem:
      description: Request validation failed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    SetupStatus:
      type: object
      required: [initialized]
      properties:
        initialized:
          type: boolean
    CapabilitiesResponse:
      type: object
      required: [capabilities]
      properties:
        capabilities:
          type: array
          items:
            type: string
    CreateFirstAdminRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
        displayName:
          type: string
    CreateFirstAdminResponse:
      type: object
      required: [username]
      properties:
        username:
          type: string
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
        domain:
          $ref: "#/components/schemas/AuthDomain"
    AuthDomain:
      type: string
      description: >
        Authentication domain (identity store / IdP). V1 supports only
        `local` — the appliance-local user store. On login request bodies,
        omitted and empty values are accepted and default to `local`.
        Session responses always return the resolved domain (never empty).
      enum: [local]
      default: local
      example: local
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    LoginResponse:
      type: object
      required: [accessToken, refreshToken, accessExpiresAt]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        accessExpiresAt:
          type: string
          format: date-time
    Session:
      type: object
      required: [userId, username, domain, authMethod, permissions]
      properties:
        userId:
          type: string
        username:
          type: string
        domain:
          $ref: "#/components/schemas/AuthDomain"
        authMethod:
          type: string
        permissions:
          type: array
          items:
            type: string
    DNSRecord:
      type: object
      required: [name, fqdn, ipv4, ttl, source, createdAt, updatedAt]
      properties:
        name:
          type: string
          example: registry1
        fqdn:
          type: string
          example: registry1.appliance.internal
        ipv4:
          type: string
          example: 192.168.1.102
        ttl:
          type: integer
        source:
          type: string
          enum: [bootstrap, admin, peer]
        owner:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        leaseExpiresAt:
          type: string
          format: date-time
    WorkProfile:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        repos:
          type: array
          items:
            $ref: "#/components/schemas/WorkProfileRepo"
    WorkProfileRepo:
      type: object
      required: [name]
      properties:
        name:
          type: string
        enabledByDefault:
          type: boolean
    CreateWorkspaceRequest:
      type: object
      required: [name, workProfile]
      properties:
        name:
          type: string
        workProfile:
          type: string
          description: Workspace profile name.
    Workspace:
      type: object
      required: [id, ownerId, name, workProfile, sourceRepoUrl, sourceRef, status, createdAt, updatedAt]
      properties:
        id:
          type: string
        ownerId:
          type: string
        name:
          type: string
        workProfile:
          type: string
        sourceRepoUrl:
          type: string
        sourceRef:
          type: string
        status:
          type: string
        reasonCode:
          type: string
        errorMessage:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
    BuildTarget:
      type: object
      required: [name, repo, execution, containerfilePath, imageRepository]
      properties:
        name:
          type: string
        aliases:
          type: array
          items:
            type: string
        description:
          type: string
        repo:
          type: string
        execution:
          type: string
          enum: [make, script]
        args:
          type: array
          items:
            type: string
        containerfilePath:
          type: string
        imageRepository:
          type: string
    BuilderGitAccessStatus:
      type: object
      required: [configured, canConfigure]
      properties:
        configured:
          type: boolean
        host:
          type: string
        username:
          type: string
        requiredHosts:
          type: array
          items:
            type: string
        canConfigure:
          type: boolean
    UpdateBuilderGitAccessRequest:
      type: object
      required: [host, username, token]
      properties:
        host:
          type: string
        username:
          type: string
        token:
          type: string
    APIToken:
      type: object
      required: [id, userId, name, createdAt, expiresAt]
      properties:
        id:
          type: string
        userId:
          type: string
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
    CreateTokenRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        lifetimeSeconds:
          type: integer
        scopes:
          type: array
          items:
            type: string
    CreateTokenResponse:
      allOf:
        - type: object
          required: [token]
          properties:
            token:
              type: string
        - $ref: "#/components/schemas/APIToken"
    RegistryGrant:
      type: object
      required: [id, subjectType, subjectId, pathPrefix, actions, createdAt]
      properties:
        id:
          type: string
        subjectType:
          type: string
          enum: [user, role]
        subjectId:
          type: string
        pathPrefix:
          type: string
        actions:
          type: array
          items:
            type: string
            enum: [pull, push]
        createdAt:
          type: string
          format: date-time
    CreateRegistryGrantRequest:
      type: object
      required: [subjectType, subjectId, pathPrefix, actions]
      properties:
        subjectType:
          type: string
          enum: [user, role]
        subjectId:
          type: string
        pathPrefix:
          type: string
        actions:
          type: array
          items:
            type: string
            enum: [pull, push]
    RegistryDescriptor:
      type: object
      required: [mediaType, digest, size]
      properties:
        mediaType:
          type: string
        digest:
          type: string
        size:
          type: integer
        artifactType:
          type: string
    SubmitBuildRequest:
      type: object
      required: [targetName]
      properties:
        targetName:
          type: string
        imageTag:
          type: string
    Job:
      type: object
      required: [id, ownerId, type, status, createdAt, updatedAt]
      properties:
        id:
          type: string
        ownerId:
          type: string
        workspaceId:
          type: string
        buildId:
          type: string
        type:
          type: string
        status:
          type: string
        targetName:
          type: string
        artifactRef:
          type: string
        reasonCode:
          type: string
        errorMessage:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
    JobStep:
      type: object
      required: [id, jobId, name, status, createdAt]
      properties:
        id:
          type: string
        jobId:
          type: string
        name:
          type: string
        status:
          type: string
        message:
          type: string
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
    Problem:
      type: object
      required: [type, title, status, code, instance]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        instance:
          type: string
        requestId:
          type: string
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
