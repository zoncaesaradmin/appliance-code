capabilities:
  base:
    displayName: Base
    requires: []
    conflicts: []
    license:
      requiredEntitlement: zon.capabilities.base
    artifacts:
      required:
        - control-plane-image
        - control-plane-chart
        - ui-image
        - blob-storage-image
        - message-broker-image
        - message-broker-chart
  actions:
    displayName: Actions
    requires: [base]
    conflicts: []
    license:
      requiredEntitlement: zon.capabilities.actions
    artifacts:
      # Action Runtime shares the control-plane image. This capability
      # controls its deployment and lifecycle rather than a separate archive.
      required: []
  channel-integrations:
    displayName: Channel Integrations
    requires: [base]
    conflicts: []
    license:
      requiredEntitlement: zon.capabilities.channel-integrations
    artifacts:
      required: [channel-integration-image]
  commerce:
    displayName: Commerce
    requires: [base]
    conflicts: []
    license:
      requiredEntitlement: zon.capabilities.commerce
    artifacts:
      required: [ordering-image]
  application-identity:
    displayName: Application Identity
    requires: [base, application-auth]
    conflicts: []
    license:
      requiredEntitlement: zon.capabilities.application-identity
    artifacts:
      required: [application-identity-image]
  application-auth:
    displayName: Application Authentication
    requires: [base]
    conflicts: []
    license:
      requiredEntitlement: zon.capabilities.application-auth
    artifacts:
      required: [auth-service-image]
  lan-discovery:
    displayName: LAN Discovery
    requires: [base]
    conflicts: []
    license:
      requiredEntitlement: zon.capabilities.lan-discovery
    artifacts:
      required: [host-agent-daemon, mdns-host-packages]
  host:
    displayName: Host
    requires: [base]
    conflicts: []
    license:
      requiredEntitlement: zon.capabilities.host
    artifacts:
      required: [host-agent-image]
  files:
    displayName: Files
    requires: [base]
    conflicts: []
    license:
      requiredEntitlement: zon.capabilities.files
    artifacts:
      required: []
  artifact:
    displayName: Artifact
    requires: [base]
    conflicts: []
    license:
      requiredEntitlement: zon.capabilities.artifact
    artifacts:
      required: [artifact-server-image, appliance-registry-chart]
  dns:
    displayName: LAN DNS
    requires: [base]
    conflicts: []
    license:
      requiredEntitlement: zon.capabilities.dns
    artifacts:
      required: [coredns-image, appliance-dns-chart]
  inference:
    displayName: Inference
    requires: [base]
    conflicts: []
    license:
      requiredEntitlement: zon.capabilities.inference
    artifacts:
      # Inference delivery is API/runtime only. Open WebUI is a separate
      # optional capability/pack and is never part of this closure.
      required: [inference-runtime-image, inference-manager-image, appliance-inference-chart]
  open-webui:
    displayName: Open WebUI
    requires: [inference]
    conflicts: []
    license:
      requiredEntitlement: zon.capabilities.open-webui
    artifacts:
      # Temporary optional chat showcase over local inference. Product-specific
      # UIs may replace this; omit the open-webui pack for API-only or
      # integrated SKUs that do not want the third-party Web UI.
      required: [open-webui-image, open-webui-gateway-image]
  video:
    displayName: Video
    requires: [base]
    conflicts: []
    license:
      requiredEntitlement: zon.capabilities.video
    artifacts:
      required: []
  guest-access:
    displayName: Guest Access
    requires: [base]
    conflicts: []
    license:
      requiredEntitlement: zon.capabilities.guest-access
    artifacts:
      required: []
  focus-content:
    displayName: Focus Content
    requires: [base, video]
    conflicts: []
    license:
      requiredEntitlement: zon.capabilities.focus-content
    artifacts:
      required: []
  applications:
    displayName: Applications
    requires: [base, host]
    conflicts: []
    license:
      requiredEntitlement: zon.capabilities.applications
    artifacts:
      required: [host-agent-image, jellyfin-image]
  plaintext-http:
    displayName: Plaintext HTTP
    requires: [base]
    conflicts: []
    license:
      requiredEntitlement: zon.capabilities.plaintext-http
    artifacts:
      required: []
  geo-spatial-store:
    displayName: Geo Spatial Store
    requires: [base, application-auth]
    conflicts: []
    license:
      requiredEntitlement: zon.capabilities.geo-spatial-store
    artifacts:
      # Runtime artifacts are added with the Geo-Zone service implementation.
      # Keeping this capability in the signed catalog now establishes the
      # dependency/entitlement seam without making the installer guess at
      # unverified images.
      required: []
  geo-data-api:
    displayName: Geo Data API
    requires: [base, application-auth, geo-spatial-store]
    conflicts: []
    license:
      requiredEntitlement: zon.capabilities.geo-data-api
    artifacts:
      required: []
  geo-basemap:
    displayName: Geo Basemap
    requires: [base]
    conflicts: []
    license:
      requiredEntitlement: zon.capabilities.geo-basemap
    artifacts:
      # The basemap must be an appliance-owned offline asset. No public tile
      # provider is selected by metadata or used as a runtime fallback.
      required: []
  geo-zone-editor:
    displayName: Geo-Zone Editor
    requires: [base, application-auth, geo-data-api, geo-basemap]
    conflicts: []
    license:
      requiredEntitlement: zon.capabilities.geo-zone-editor
    artifacts:
      required: []
