capabilities:
  base:
    displayName: Base
    requires: []
    conflicts: []
    license:
      requiredEntitlement: zon.capabilities.base
    artifacts:
      required:
        - control-plane-image
        - control-plane-chart
        - ui-image
        - blob-storage-image
        - message-broker-image
        - message-broker-chart
  lan-discovery:
    displayName: LAN Discovery
    requires: [base]
    conflicts: []
    license:
      requiredEntitlement: zon.capabilities.lan-discovery
    artifacts:
      required: [host-agent-daemon, mdns-host-packages]
  host:
    displayName: Host
    requires: [base]
    conflicts: []
    license:
      requiredEntitlement: zon.capabilities.host
    artifacts:
      required: [host-agent-image]
  files:
    displayName: Files
    requires: [base]
    conflicts: []
    license:
      requiredEntitlement: zon.capabilities.files
    artifacts:
      required: []
  workflows:
    displayName: Workflows
    requires: [base]
    conflicts: []
    license:
      requiredEntitlement: zon.capabilities.workflows
    artifacts:
      required:
        - workflows-chart
        - workflows-crds
        - workflow-controller-image
        - workflow-executor-image
  build:
    displayName: Build
    requires: [base, host, workflows, artifact]
    conflicts: []
    license:
      requiredEntitlement: zon.capabilities.build
    artifacts:
      required: [workspace-provisioner-image]
  artifact:
    displayName: Artifact
    requires: [base]
    conflicts: []
    license:
      requiredEntitlement: zon.capabilities.artifact
    artifacts:
      required: [artifact-server-image, appliance-registry-chart]
  dns:
    displayName: LAN DNS
    requires: [base]
    conflicts: []
    license:
      requiredEntitlement: zon.capabilities.dns
    artifacts:
      required: [coredns-image, appliance-dns-chart]
  inference:
    displayName: Inference
    requires: [base]
    conflicts: []
    license:
      requiredEntitlement: zon.capabilities.inference
    artifacts:
      required: [inference-runtime-image, inference-manager-image, appliance-inference-chart]
  video:
    displayName: Video
    requires: [base]
    conflicts: []
    license:
      requiredEntitlement: zon.capabilities.video
    artifacts:
      required: []
  guest-access:
    displayName: Guest Access
    requires: [base]
    conflicts: []
    license:
      requiredEntitlement: zon.capabilities.guest-access
    artifacts:
      required: []
  focus-content:
    displayName: Focus Content
    requires: [base, video]
    conflicts: []
    license:
      requiredEntitlement: zon.capabilities.focus-content
    artifacts:
      required: []
  applications:
    displayName: Applications
    requires: [base, host]
    conflicts: []
    license:
      requiredEntitlement: zon.capabilities.applications
    artifacts:
      required: [host-agent-image, jellyfin-image]
  plaintext-http:
    displayName: Plaintext HTTP
    requires: [base]
    conflicts: []
    license:
      requiredEntitlement: zon.capabilities.plaintext-http
    artifacts:
      required: []
