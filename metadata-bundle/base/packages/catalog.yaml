packages:
  foundation:
    displayName: Foundation
    description: Core appliance services, baseline product functionality, and local mDNS discovery.
    capabilities: [base, lan-discovery, files, video, guest-access, focus-content, plaintext-http]
  dev-platform:
    displayName: Development Platform Services
    description: Artifact registry, appliance-owned LAN DNS, workflow execution, and build workspace provisioning.
    capabilities: [artifact, dns, workflows, build]
  deviceuser:
    displayName: Device User Services
    description: Host-agent-backed host and application management.
    capabilities: [host, applications]
  std-llm:
    displayName: Standard LLM
    description: Standard inference using Ollama for simpler, lower-capacity deployments. The runtime uses CPU or a host GPU when one is available. Does not include Open WebUI; add the open-webui pack for the optional chat UI.
    capabilities: [inference]
    runtime: {inferenceEngine: ollama}
  acc-llm:
    displayName: Accelerated LLM
    description: Accelerated inference using vLLM. Requires a proper GPU on the install host. Does not include Open WebUI; add the open-webui pack for the optional chat UI.
    capabilities: [inference]
    runtime: {inferenceEngine: vllm}
  open-webui:
    displayName: Open WebUI
    description: Optional temporary chat UI (Open WebUI + session bridge) over local inference. Requires std-llm or acc-llm in the same APPLIANCE_PACKS selection. Omit for API-only or integrated products that supply their own UI.
    capabilities: [open-webui]
