packages:
  foundation:
    displayName: Foundation
    description: Core appliance services, baseline product functionality, and local mDNS discovery.
    capabilities: [base, lan-discovery, files, video, guest-access, focus-content, plaintext-http]
  dev-platform:
    displayName: Development Platform Services
    description: Artifact registry, appliance-owned LAN DNS, workflow execution, and build workspace provisioning.
    capabilities: [artifact, dns, workflows, build]
  deviceuser:
    displayName: Device User Services
    description: Host-agent-backed host and application management.
    capabilities: [host, applications]
  std-llm-amd64:
    displayName: Standard LLM (amd64)
    description: Standard inference using Ollama for simpler, lower-capacity deployments. The runtime uses CPU or a host GPU when one is available.
    capabilities: [inference]
    runtime: {inferenceEngine: ollama, architecture: amd64}
  acc-llm-amd64:
    displayName: Accelerated LLM (amd64)
    description: Accelerated inference using vLLM. Requires a proper GPU on the install host.
    capabilities: [inference]
    runtime: {inferenceEngine: vllm, architecture: amd64}
  acc-llm-arm64:
    displayName: Accelerated LLM (arm64)
    description: Accelerated inference using vLLM. Requires a proper GPU on the install host.
    capabilities: [inference]
    runtime: {inferenceEngine: vllm, architecture: arm64}
