profiles:
  core:
    displayName: core
    description: "Default base appliance profile."
    capabilities: [base, actions, lan-discovery, files]
  application-core:
    displayName: application-core
    description: "Application as appliance base profile."
    capabilities: [base, commerce, channel-integrations, application-identity, application-auth]
  storage-landns:
    displayName: storage-landns
    description: "File storage, artifact registry, and LAN DNS."
    capabilities: [base, actions, lan-discovery, files, artifact, dns]
  training:
    displayName: training
    description: "Core appliance plus video library and playback."
    capabilities: [base, actions, lan-discovery, host, files, video, guest-access, focus-content, applications, plaintext-http]
  private-ai:
    displayName: private-ai
    description: "Private ai appliance providing multi user inference."
    capabilities: [base, actions, lan-discovery, inference]
  private-ai-webui:
    displayName: private-ai-webui
    description: "Private ai appliance providing multi user inference and optional Open WebUI chat."
    capabilities: [base, actions, lan-discovery, inference, open-webui]
