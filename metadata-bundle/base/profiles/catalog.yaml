profiles:
  core:
    displayName: core
    description: "Default base appliance profile."
    capabilities: [base, files]
  storage-landns:
    displayName: storage-landns
    description: "Built-in appliance profile."
    capabilities: [base, host, files, artifact, dns]
  builder-storage-landns:
    displayName: builder-storage-landns
    description: "Built-in appliance profile."
    capabilities: [base, host, files, workflows, build, artifact, dns]
  lanllm:
    displayName: lanllm
    description: "Local LLM inference API without builder."
    capabilities: [base, inference]
  builder-lanllm-storage-landns:
    displayName: builder-lanllm-storage-landns
    description: "Full union: builder, registry/storage, LAN DNS, and local LLM inference."
    capabilities: [base, host, files, workflows, build, artifact, dns, inference]
  training:
    displayName: training
    description: "Core appliance plus video library and playback."
    capabilities: [base, files, video]
