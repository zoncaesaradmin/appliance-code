# Reviewed application contracts are added here by release engineering. Images
# are exported into the signed appliance bundle and imported locally before an
# administrator can enable the corresponding application.
applications:
  - apiVersion: appliance.zon/v1
    kind: ApplicationDefinition
    metadata:
      name: jellyfin
      version: 10.10.7
      description: Jellyfin media streaming for approved appliance video libraries.
    runtime:
      image:
        # jellyfin/jellyfin:10.10.7 linux/amd64, re-exported into the signed
        # appliance OCI layout as registry.local/jellyfin.
        reference: registry.local/jellyfin@sha256:47b47ee4ffa13c7a900318eb501664204ac95f7142cfe1b754a9ab4f9704b4b8
      port: 8096
      endpoints:
        - name: http
          protocol: TCP
          port: 8096
          targetPort: 8096
          direct: true
          mdns:
            serviceType: _jellyfin._tcp
            instance: jellyfin
            aliases: [jellyfin.local]
        - name: discovery
          protocol: UDP
          port: 7359
          targetPort: 7359
          direct: true
          mdns:
            serviceType: _jellyfin._udp
            instance: jellyfin-discovery
      volumes:
        - name: config
          kind: persistent
          mountPath: /config
          size: 5Gi
        - name: cache
          kind: emptyDir
          mountPath: /cache
        - name: media
          kind: videoProjection
          mountPath: /media
          readOnly: true
      security:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 20000
