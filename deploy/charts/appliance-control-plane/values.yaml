# Default values for appliance-control-plane.
# ADR 0004 fixes exactly one replica while SQLite is the persistence
# backend; do not scale this chart.
replicaCount: 1

image:
  repository: appliance-control-plane
  tag: "" # defaults to .Chart.AppVersion; the release pins by digest instead
  digest: "" # e.g. sha256:...; when set, takes precedence over tag
  pullPolicy: IfNotPresent

ui:
  enabled: true
  image:
    repository: appliance-ui
    tag: "" # defaults to .Chart.AppVersion
    digest: ""
    pullPolicy: IfNotPresent
  service:
    port: 8080
  config:
    logLevel: info
    cookieSecure: true
    staticDir: /opt/appliance-ui/dist
    controlPlaneBaseURL: "" # empty => derive from the rendered public Service name
    controlPlaneInternalBaseURL: "" # empty => derive from the rendered internal Service name
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10002
    runAsGroup: 10002
    fsGroup: 20000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault

nameOverride: ""
fullnameOverride: ""

namespace:
  # The installer may pre-create the namespace with its own Pod Security
  # Admission labels instead; set this to false in that case.
  create: true
  name: ""

# Non-secret runtime configuration, rendered into a ConfigMap and consumed
# as APPLIANCE_* environment variables by internal/config. Secrets (signing
# keys, TLS, etc.) are never templated by this chart; the installer/lifecycle
# CLI creates them out of band and the chart only references their names,
# per ADR 0005.
config:
  applianceProfile: core
  # Product LAN instance label (single DNS label). zonctl sets this from
  # --appliance-name; FQDN is applianceName.dnsZoneName.
  applianceName: ""
  # Node IPv4 for operator-facing identity (dashboard). zonctl injects it.
  nodeIPv4: ""
  # Derived by zonctl as https://<applianceName>.<dnsZoneName>.
  canonicalOrigin: "https://appliance.example.internal"
  logLevel: info
  trustedProxyCount: 1
  workflowInstanceID: appliance
  # Must match the ServiceAccount the appliance-workflows chart actually
  # creates: "<appliance-workflows.fullname>-executor", where fullname is
  # pinned via that chart's own fullnameOverride: "appliance-workflows".
  # These are two independent charts with no template-level link between
  # them, so this string has to be kept in sync by hand.
  workflowExecutorServiceAccount: appliance-workflows-executor
  # Developer workflow catalog used by the builder profile. Runtime catalogs are
  # uploaded after install through the control-plane API/UI and stored in SQLite.
  # Leave this empty at install for build-capable profiles.
  buildCatalog: {}
  # Bundled appliance profile/module catalog. zonctl injects the signed
  # bundle copy so runtime profile/module resolution matches install-time
  # resolution.
  applianceCatalog: {}
  # Appliance-owned generic image used by workspace provisioning workflows.
  # zonctl injects this from the signed bundle for build-capable profiles.
  workspaceProvisionerImageDigest: ""
  # Single bundled builder/dev-container image used by all workflow build pods.
  # zonctl injects this from the signed bundle (dev-build) for
  # build-capable profiles. Build catalogs must not set per-target builder digests.
  builderImageDigest: ""
  # Internal Artifact Server data-plane endpoint. Artifact-bearing production profiles
  # (builder, storage, storage-landns, builder-landns, builder-storage-landns)
  # fail closed if this is empty; local tests may explicitly enable fake Artifact Server.
  artifactServerBaseURL: "http://appliance-registry.artifacts.svc.cluster.local:5000"
  artifactServerAllowFake: false
  # CoreDNS ready-plugin URL. DNS-bearing profiles (landns, storage-landns,
  # builder-landns, builder-storage-landns) fail closed at control-plane
  # startup when this is empty so the appliance never reports dns-capable
  # while the LAN DNS release is missing.
  dnsReadyURL: ""
  # OpenAI-compatible inference gateway base URL (no path). Inference
  # profiles (lanllm, builder-lanllm, builder-lanllm-storage-landns) fail closed when empty.
  inferenceGatewayBaseURL: ""
  # Bundled manifest describing in-cluster services whose selected routes are
  # exposed through the appliance API. zonctl injects host-agent here today;
  # post-install addon lifecycle is intentionally a later step.
  serviceRegistry:
    services: []
  # LAN DNS zone ownership (control plane is source of truth; CoreDNS serves
  # a materialized ConfigMap zone file). Product A records are not seeded at
  # install; create them via the DNS records API/UI. Optional bootstrap_*
  # fields remain for rare operator overrides and stay empty by default.
  # Host mDNS / management Wi-Fi AP are day-2 only (Admin UI → host-agent APIs).
  dnsZoneName: "appliance.internal"
  dnsConfigMapNamespace: "dns"
  dnsConfigMapName: "dns-server-config"
  dnsBootstrapHostname: ""
  dnsBootstrapIPv4: ""
  dnsAllowFakeZoneSync: false

files:
  rootDir: /data/zon/files
  # Keep as a quoted decimal string. Bare YAML integers above 2^31 can be
  # loaded as float64 and | quote then emits scientific notation that Go's
  # strconv.ParseInt rejects (e.g. "2.147483648e+10").
  maxUploadBytes: "21474836480"
  transferTimeout: 30m

secrets:
  # Secret holding the purpose-separated key material internal/keys expects
  # (session_ed25519_private.key, api_token_pepper.key, refresh_pepper.key),
  # mounted read-only at dataDir/keys.
  keysSecretName: "appliance-keys"

persistence:
  enabled: true
  storageClassName: "" # cluster default if empty; must be a local ext4-backed RWO class per ADR 0004
  size: 10Gi
  accessMode: ReadWriteOnce
  dataDir: /var/lib/appliance/data
  # Host-visible extracted metadata bundles; zonctl seeds this before Helm.
  # Mounted over dataDir/metadata-bundles so the control plane prefers the
  # install-time archive over the embedded fallback.
  metadataBundlesHostPath: /data/zon/metadata-bundles

workspaceStorage:
  enabled: true
  storageClassName: ""
  size: 20Gi
  accessMode: ReadWriteOnce
  rootDir: /data/zon/workspaces # fixed host-visible workspace path, also used as the PV hostPath backing
  # zonctl prepares /data/zon/workspaces before Helm runs. Keep this false:
  # the chart no longer ships a helper Job for helm-only ownership prep,
  # because that path depended on a separate root+hostPath container image and
  # was incompatible with both Restricted PSA and the appliance's offline
  # install contract.
  prepareJob:
    enabled: false

service:
  publicPort: 8080
  internalPort: 8081

ingress:
  enabled: true
  # Traefik IngressRoute (CRD). The CRD itself is provided by the K3s-bundled
  # Traefik, not this chart; rendering does not require it to be installed.
  entryPoints:
    - websecure
  host: ""
  tlsSecretName: "appliance-tls"
  forwardAuth:
    enabled: true
    responseHeaders:
      - X-Appliance-User-Id
      - X-Appliance-Username
      - X-Appliance-Auth-Domain
      - X-Appliance-Scopes
      - X-Appliance-Roles
      - X-Appliance-Auth-Method

serviceAccount:
  create: true
  name: ""
  # No Kubernetes API access is needed by the control plane yet; Phase 6
  # (build vertical slice) adds a narrowly scoped Role for Workflow
  # submission, at which point this is revisited.
  automountServiceAccountToken: false

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 20000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

hostAgent:
  enabled: true
  # K8s resource basename (Deployment/Service). Independent of api-server.
  nameOverride: ""
  image:
    reference: registry.local/appliance-host-agent:dev
    pullPolicy: IfNotPresent
  service:
    port: 8080
  runtime:
    socketHostDir: /run/zon/host-agent
    socketMountPath: /run/zon/host-agent
    socketFileName: agent.sock
  logs:
    hostPath: /data/zon/logs/host-agent
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10005
    runAsGroup: 10005
    fsGroup: 20000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

networkPolicy:
  enabled: true
  # Namespace selector label for Traefik's namespace, used to scope the
  # explicit public-port allow rule. Left empty, the policy still
  # default-denies but grants no ingress at all, which is safe-by-default
  # but non-functional until configured for the target cluster.
  traefikNamespaceLabel: {}
  # Artifact Server runs in the dedicated artifacts namespace (not control).
  registryNamespaceLabel:
    kubernetes.io/metadata.name: artifacts
  registryPodLabels:
    app.kubernetes.io/name: appliance-registry
  registryPort: 5000
  # Populated by zonctl for dns-capable profiles so CP can probe CoreDNS
  # readiness. Left empty (no egress rule) when DNS is not installed.
  dnsNamespaceLabel: {}
  dnsPodLabels: {}
  dnsReadyPort: 8181
  # Populated by zonctl for inference-capable profiles so CP can proxy
  # OpenAI-compatible traffic to the inference gateway. Left empty when off.
  inferenceNamespaceLabel: {}
  inferencePodLabels: {}
  inferencePort: 8080
  hostAgentPort: 8080

probes:
  livenessPath: /health/live
  readinessPath: /health/ready
  startupPath: /health/startup
  startupFailureThreshold: 30
  startupPeriodSeconds: 2

priorityClassName: ""
