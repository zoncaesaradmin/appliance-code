{{- if eq (include "appliance-control-plane.applicationSupportEnabled" .) "true" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "appliance-control-plane.fullname" . }}-applications
  namespace: {{ include "appliance-control-plane.applicationNamespace" . }}
  labels:
    {{- include "appliance-control-plane.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "persistentvolumeclaims"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "appliance-control-plane.fullname" . }}-applications
  namespace: {{ include "appliance-control-plane.applicationNamespace" . }}
  labels:
    {{- include "appliance-control-plane.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "appliance-control-plane.serviceAccountName" . }}
    namespace: {{ include "appliance-control-plane.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "appliance-control-plane.fullname" . }}-applications
{{- end }}
