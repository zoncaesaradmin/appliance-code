{{- if and .Values.networkPolicy.enabled (eq (include "appliance-control-plane.applicationAuthEnabled" .) "true") }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "appliance-control-plane.authServiceName" . }}-allow
  namespace: {{ include "appliance-control-plane.appCoreNamespace" . }}
  labels:
    {{- include "appliance-control-plane.authServiceLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "appliance-control-plane.authServiceSelectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "appliance-control-plane.appsNamespace" . | quote }}
          podSelector:
            matchLabels:
              {{- include "appliance-control-plane.applicationIdentitySelectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.applicationServices.auth.service.port }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "appliance-control-plane.infraNamespace" . | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: platform-postgres
      ports:
        - protocol: TCP
          port: 5432
    {{- if eq .Values.applicationServices.auth.deliveryMode "event" }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "appliance-control-plane.infraNamespace" . | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: message-broker
      ports:
        - protocol: TCP
          port: 4222
    {{- end }}
{{- end }}
