{{- if and .Values.networkPolicy.enabled (eq (include "appliance-control-plane.aceSystemEnabled" .) "true") }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "appliance-control-plane.fullname" . }}-default-deny
  namespace: {{ include "appliance-control-plane.namespace" . }}
  labels:
    {{- include "appliance-control-plane.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "appliance-control-plane.fullname" . }}-allow
  namespace: {{ include "appliance-control-plane.namespace" . }}
  labels:
    {{- include "appliance-control-plane.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "appliance-control-plane.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- if .Values.networkPolicy.traefikNamespaceLabel }}
    # Only Traefik may reach the public port; the internal listener is never
    # granted an ingress rule reaching outside this namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.traefikNamespaceLabel | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.publicPort }}
    {{- end }}
    # Same-namespace access to the internal listener, for future
    # in-namespace diagnostics/support-bundle jobs.
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.service.internalPort }}
    {{- if .Values.ui.enabled }}
    # UI pod calls the control-plane API (may live in appsNamespace).
    - from:
        {{- if include "appliance-control-plane.appsNamespaced" . }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "appliance-control-plane.appsNamespace" . | quote }}
          podSelector:
            matchLabels:
              {{- include "appliance-control-plane.uiSelectorLabels" . | nindent 14 }}
        {{- else }}
        - podSelector:
            matchLabels:
              {{- include "appliance-control-plane.uiSelectorLabels" . | nindent 14 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.publicPort }}
        - protocol: TCP
          port: {{ .Values.service.internalPort }}
    {{- end }}
  egress:
    # Artifact catalog and dependency-health calls go only to the dedicated
    # registry pod and port.
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.registryNamespaceLabel | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.registryPodLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.registryPort }}
    {{- $dnsNS := index .Values.networkPolicy.dnsNamespaceLabel "kubernetes.io/metadata.name" | default "" }}
    {{- if $dnsNS }}
    # LAN DNS readiness probe (CoreDNS :8181) for dns-capable profiles.
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dnsNamespaceLabel | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dnsPodLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.dnsReadyPort }}
    {{- end }}
    {{- $inferenceNS := index .Values.networkPolicy.inferenceNamespaceLabel "kubernetes.io/metadata.name" | default "" }}
    {{- if $inferenceNS }}
    # Inference gateway proxy for inference-capable profiles.
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.inferenceNamespaceLabel | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.inferencePodLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.inferencePort }}
    {{- end }}
    {{- $videoNS := index .Values.networkPolicy.videoNamespaceLabel "kubernetes.io/metadata.name" | default "" }}
    {{- if $videoNS }}
    # Video gateway proxy for video-capable profiles.
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.videoNamespaceLabel | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.videoPodLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.videoPort }}
    {{- end }}
    {{- if .Values.hostAgent.enabled }}
    - to:
        {{- if include "appliance-control-plane.appsNamespaced" . }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "appliance-control-plane.appsNamespace" . | quote }}
          podSelector:
            matchLabels:
              {{- include "appliance-control-plane.hostAgentSelectorLabels" . | nindent 14 }}
        {{- else }}
        - podSelector:
            matchLabels:
              {{- include "appliance-control-plane.hostAgentSelectorLabels" . | nindent 14 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.hostAgentPort }}
    {{- end }}
    {{- if .Values.automationRuntime.enabled }}
    - to:
        {{- if include "appliance-control-plane.appsNamespaced" . }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "appliance-control-plane.appsNamespace" . | quote }}
          podSelector:
            matchLabels:
              {{- include "appliance-control-plane.automationRuntimeSelectorLabels" . | nindent 14 }}
        {{- else }}
        - podSelector:
            matchLabels:
              {{- include "appliance-control-plane.automationRuntimeSelectorLabels" . | nindent 14 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.automationRuntimePort }}
    {{- end }}
    # Cluster DNS is required for Service name lookup (registry, dns, …).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
{{- if and .Values.networkPolicy.enabled (eq (include "appliance-control-plane.aceAppsEnabled" .) "true") }}
{{- if include "appliance-control-plane.appsNamespaced" . }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "appliance-control-plane.fullname" . }}-apps-default-deny
  namespace: {{ include "appliance-control-plane.appsNamespace" . }}
  labels:
    {{- include "appliance-control-plane.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
{{- end }}
{{- if .Values.ui.enabled }}
---
