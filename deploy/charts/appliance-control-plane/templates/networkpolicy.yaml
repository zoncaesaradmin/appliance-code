  namespace: {{ include "appliance-control-plane.appsNamespace" . }}
  labels:
    {{- include "appliance-control-plane.uiLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "appliance-control-plane.uiSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- if .Values.networkPolicy.traefikNamespaceLabel }}
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.traefikNamespaceLabel | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.ui.service.port }}
    {{- end }}
  egress:
    - to:
        {{- if include "appliance-control-plane.appsNamespaced" . }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "appliance-control-plane.namespace" . | quote }}
          podSelector:
            matchLabels:
              {{- include "appliance-control-plane.selectorLabels" . | nindent 14 }}
        {{- else }}
        - podSelector:
            matchLabels:
              {{- include "appliance-control-plane.selectorLabels" . | nindent 14 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.publicPort }}
        - protocol: TCP
          port: {{ .Values.service.internalPort }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
