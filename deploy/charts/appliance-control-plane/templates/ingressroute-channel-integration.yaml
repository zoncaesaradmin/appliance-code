{{- if and (eq (include "appliance-control-plane.aceAppsEnabled" .) "true") (eq (include "appliance-control-plane.channelIntegrationsEnabled" .) "true") .Values.channelIntegration.ingress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "appliance-control-plane.channelIntegrationName" . }}
  namespace: {{ include "appliance-control-plane.appsNamespace" . }}
  labels:
    {{- include "appliance-control-plane.channelIntegrationLabels" . | nindent 4 }}
spec:
  entryPoints:
    {{- toYaml .Values.channelIntegration.ingress.entryPoints | nindent 4 }}
  routes:
    - match: {{- if .Values.channelIntegration.ingress.host }} Host(`{{ .Values.channelIntegration.ingress.host }}`) &&{{ end }} PathPrefix(`/webhook`)
      kind: Rule
      services:
        - name: {{ include "appliance-control-plane.channelIntegrationName" . }}
          port: {{ .Values.channelIntegration.service.port }}
  tls:
    secretName: {{ .Values.channelIntegration.ingress.tlsSecretName }}
{{- end }}
