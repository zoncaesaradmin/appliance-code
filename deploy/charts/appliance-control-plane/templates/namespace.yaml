{{- if and (eq (include "appliance-control-plane.aceSystemEnabled" .) "true") .Values.namespace.create }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "appliance-control-plane.namespace" . }}
  labels:
    {{- include "appliance-control-plane.labels" . | nindent 4 }}
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
{{- end }}
{{- if and (eq (include "appliance-control-plane.applicationSupportEnabled" .) "true") .Values.applicationNamespace.create }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: appliance-application-management
  namespace: {{ include "appliance-control-plane.applicationNamespace" . }}
  labels:
    app.kubernetes.io/part-of: appliance
    app.kubernetes.io/component: managed-applications
data:
  ownership: appliance-control-plane
  contract-version: v1
{{- end }}
{{- if and (eq (include "appliance-control-plane.aceAppsEnabled" .) "true") .Values.appsNamespace.create (include "appliance-control-plane.appsNamespaced" .) }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "appliance-control-plane.appsNamespace" . }}
  labels:
    {{- include "appliance-control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: apps
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
{{- end }}
