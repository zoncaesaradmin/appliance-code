{{- if and (eq (include "appliance-control-plane.aceSystemEnabled" .) "true") .Values.namespace.create }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "appliance-control-plane.namespace" . }}
  labels:
    {{- include "appliance-control-plane.labels" . | nindent 4 }}
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
{{- end }}
{{- if and (eq (include "appliance-control-plane.aceInfraEnabled" .) "true") .Values.infraNamespace.create }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "appliance-control-plane.infraNamespace" . }}
  labels:
    {{- include "appliance-control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: infrastructure
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
{{- end }}
{{- if and (eq (include "appliance-control-plane.aceAppCoreEnabled" .) "true") .Values.appCoreNamespace.create }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "appliance-control-plane.appCoreNamespace" . }}
  labels:
    {{- include "appliance-control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: application-core
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
{{- end }}
{{- if and (eq (include "appliance-control-plane.aceAppsEnabled" .) "true") .Values.appsNamespace.create (include "appliance-control-plane.appsNamespaced" .) }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "appliance-control-plane.appsNamespace" . }}
  labels:
    {{- include "appliance-control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: apps
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
{{- end }}
