{{- if eq (include "appliance-control-plane.aceInfraEnabled" .) "true" }}
{{- $ns := include "appliance-control-plane.infraNamespace" . -}}
{{- $existing := lookup "v1" "Secret" $ns .Values.blobStorage.credentialsSecretName -}}
{{- $accessKey := "" -}}
{{- $secretKey := "" -}}
{{- if $existing -}}
{{- $accessKey = index $existing.data "accessKey" -}}
{{- $secretKey = index $existing.data "secretKey" -}}
{{- else -}}
{{- $accessKey = randAlphaNum 20 | b64enc -}}
{{- $secretKey = randAlphaNum 40 | b64enc -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.blobStorage.credentialsSecretName }}
  namespace: {{ $ns }}
type: Opaque
data:
  accessKey: {{ $accessKey }}
  secretKey: {{ $secretKey }}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: appliance-blob-storage-data
spec:
  capacity: {storage: {{ .Values.blobStorage.persistence.size | quote }}}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath: {path: {{ .Values.blobStorage.persistence.hostPath | quote }}, type: DirectoryOrCreate}
  claimRef:
    namespace: {{ $ns }}
    name: {{ .Values.blobStorage.persistence.claimName }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.blobStorage.persistence.claimName }}
  namespace: {{ $ns }}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: appliance-blob-storage-data
  resources: {requests: {storage: {{ .Values.blobStorage.persistence.size | quote }}}}
---
apiVersion: v1
kind: Service
metadata:
  name: blob-storage
  namespace: {{ $ns }}
spec:
  selector: {app.kubernetes.io/name: blob-storage}
  ports: [{name: s3, port: 9000, targetPort: s3}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blob-storage
  namespace: {{ $ns }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: blob-storage}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: blob-storage}
    spec:
      automountServiceAccountToken: false
      {{- include "appliance-control-plane.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10009
        runAsGroup: 10009
        fsGroup: 20000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      # Ownership of /data/zon/blob-storage is prepared by zonctl EnsureOwnedDir
      # (UID 10009 / shared GID 20000). Do not add a root init container here:
      # ace-infra enforces Pod Security Admission restricted.
      containers:
        - name: blob-storage
          image: {{ .Values.blobStorage.image.repository }}{{ if .Values.blobStorage.image.digest }}@{{ .Values.blobStorage.image.digest }}{{ else }}:{{ .Values.blobStorage.image.tag }}{{ end }}
          imagePullPolicy: {{ .Values.blobStorage.image.pullPolicy }}
          args: ["server", "/data"]
          ports: [{name: s3, containerPort: 9000}]
          env:
            - name: MINIO_ROOT_USER
              valueFrom: {secretKeyRef: {name: {{ .Values.blobStorage.credentialsSecretName }}, key: accessKey}}
            - name: MINIO_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.blobStorage.credentialsSecretName }}, key: secretKey}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          readinessProbe: {httpGet: {path: /minio/health/ready, port: s3}}
          livenessProbe: {httpGet: {path: /minio/health/live, port: s3}}
          volumeMounts: [{name: data, mountPath: /data}, {name: tmp, mountPath: /tmp}]
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: {{ .Values.blobStorage.persistence.claimName }}}
        - name: tmp
          emptyDir: {}
---
# Pod-scoped only: the infrastructure namespace has no namespace-wide deny.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: blob-storage-allow
  namespace: {{ $ns }}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: blob-storage}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ include "appliance-control-plane.namespace" . | quote }}}}
          podSelector: {matchLabels: {app.kubernetes.io/name: controlplane}}
      ports: [{protocol: TCP, port: 9000}]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
{{- end }}
