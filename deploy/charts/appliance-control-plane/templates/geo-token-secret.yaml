{{- if and .Values.geo.enabled (eq (include "appliance-control-plane.aceSystemEnabled" .) "true") }}
{{- $existingAuth := lookup "v1" "Secret" (include "appliance-control-plane.namespace" .) .Values.geo.internalAuthSecretName -}}
{{- $authToken := "" -}}
{{- if $existingAuth }}{{ $authToken = index $existingAuth.data "token" }}{{ else }}{{ $authToken = randAlphaNum 64 | b64enc }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.geo.internalAuthSecretName }}
  namespace: {{ include "appliance-control-plane.namespace" . }}
type: Opaque
data:
  token: {{ $authToken }}
{{- end }}
