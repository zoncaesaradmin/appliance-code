{{- if and (eq (include "appliance-control-plane.aceSystemEnabled" .) "true") .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "appliance-control-plane.fullname" . }}-data
  namespace: {{ include "appliance-control-plane.namespace" . }}
  labels:
    {{- include "appliance-control-plane.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  {{- if .Values.persistence.storageClassName }}
  storageClassName: {{ .Values.persistence.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
{{- if and (eq (include "appliance-control-plane.aceAppsEnabled" .) "true") .Values.automationRuntime.enabled .Values.automationRuntime.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "appliance-control-plane.automationRuntimeClaimName" . }}
  namespace: {{ include "appliance-control-plane.appsNamespace" . }}
  labels:
    {{- include "appliance-control-plane.automationRuntimeLabels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.automationRuntime.persistence.accessMode }}
  {{- if .Values.automationRuntime.persistence.storageClassName }}
  storageClassName: {{ .Values.automationRuntime.persistence.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.automationRuntime.persistence.size }}
{{- end }}
