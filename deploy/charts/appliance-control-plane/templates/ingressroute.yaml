{{- if .Values.ingress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "appliance-control-plane.fullname" . }}
  namespace: {{ include "appliance-control-plane.namespace" . }}
  labels:
    {{- include "appliance-control-plane.labels" . | nindent 4 }}
spec:
  entryPoints:
    {{- toYaml .Values.ingress.entryPoints | nindent 4 }}
  routes:
    {{- $hostMatch := "" }}
    {{- if .Values.ingress.host }}
    {{- $hostMatch = printf "Host(`%s`) && " .Values.ingress.host }}
    {{- end }}
    - match: {{ printf "%s(PathPrefix(`/api/v1`) || PathPrefix(`/mcp`))" $hostMatch }}
      kind: Rule
      services:
        - name: {{ include "appliance-control-plane.fullname" . }}
          port: {{ .Values.service.publicPort }}
    {{- if .Values.ui.enabled }}
    # Exclude /v2 and /files so non-artifact profiles (core, landns) do not
    # serve the UI for those paths. When the registry chart is installed it
    # owns PathPrefix(`/v2`) and PathPrefix(`/files`); otherwise Traefik
    # returns 404.
    - match: {{ printf "%sPathPrefix(`/`) && !PathPrefix(`/v2`) && !PathPrefix(`/files`)" $hostMatch }}
      kind: Rule
      services:
        - name: {{ include "appliance-control-plane.uiServiceName" . }}
          port: {{ .Values.ui.service.port }}
    {{- end }}
  tls:
    secretName: {{ .Values.ingress.tlsSecretName }}
{{- end }}
