{{- if and (eq (include "appliance-control-plane.aceAppsEnabled" .) "true") .Values.ingress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "appliance-control-plane.fullname" . }}
  namespace: {{ include "appliance-control-plane.namespace" . }}
  labels:
    {{- include "appliance-control-plane.labels" . | nindent 4 }}
spec:
  entryPoints:
    {{- toYaml .Values.ingress.entryPoints | nindent 4 }}
  routes:
    {{- $hostMatch := "" }}
    {{- if .Values.ingress.host }}
    {{- $hostMatch = printf "Host(`%s`) && " .Values.ingress.host }}
    {{- end }}
    # Explicit priority: Traefik defaults priority to rule length, so adding
    # UI catch-all exclusions (e.g. !PathPrefix(`/v2`)) can otherwise make
    # the UI rule win over /api/v1 and return SPA HTML / Method Not Allowed.
    - match: {{ printf "%s(PathPrefix(`/api/v1`) || PathPrefix(`/mcp`) || PathPrefix(`/inference/v1`) || PathPrefix(`/video/v1`))" $hostMatch }}
      kind: Rule
      priority: 100
      services:
        - name: {{ include "appliance-control-plane.fullname" . }}
          port: {{ .Values.service.publicPort }}
    {{- if .Values.ui.enabled }}
    # Exclude API, MCP, inference, video, and registry paths from the UI catch-all.
    # /v2 is owned by the registry chart when artifact is enabled.
    # Authenticated file serving is /api/v1/files only (no Traefik /files).
    # When appsNamespace differs, reference the real ClusterIP Service there
    # (requires Traefik providers.kubernetesCRD.allowCrossNamespace).
    - match: {{ printf "%sPathPrefix(`/`) && !PathPrefix(`/api`) && !PathPrefix(`/mcp`) && !PathPrefix(`/inference`) && !PathPrefix(`/video`) && !PathPrefix(`/v2`)" $hostMatch }}
      kind: Rule
      priority: 1
      services:
        - name: {{ include "appliance-control-plane.uiServiceName" . }}
          {{- if include "appliance-control-plane.appsNamespaced" . }}
          namespace: {{ include "appliance-control-plane.appsNamespace" . }}
          {{- end }}
          port: {{ .Values.ui.service.port }}
    {{- end }}
  tls:
    secretName: {{ .Values.ingress.tlsSecretName }}
{{- end }}
