{{- if and (eq (include "appliance-control-plane.aceAppsEnabled" .) "true") .Values.actionRuntime.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "appliance-control-plane.actionRuntimeName" . }}
  namespace: {{ include "appliance-control-plane.appsNamespace" . }}
  labels:
    {{- include "appliance-control-plane.actionRuntimeLabels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "appliance-control-plane.actionRuntimeSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "appliance-control-plane.actionRuntimeLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- include "appliance-control-plane.podNodeName" . }}
      {{- include "appliance-control-plane.imagePullSecrets" . | nindent 6 }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.actionRuntime.podSecurityContext | nindent 8 }}
      containers:
        - name: action-runtime
          image: {{ include "appliance-control-plane.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - /appliance-action-runtime
          ports:
            - name: http
              containerPort: {{ .Values.actionRuntime.service.port }}
          envFrom:
            - configMapRef:
                name: {{ include "appliance-control-plane.actionRuntimeName" . }}-config
          securityContext:
            {{- toYaml .Values.actionRuntime.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.actionRuntime.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/startup
              port: http
            periodSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: appliance-logs
              mountPath: /data/zon/logs
            {{- if .Values.actionRuntime.persistence.enabled }}
            - name: data
              mountPath: {{ .Values.actionRuntime.config.dataDir }}
            {{- end }}
            - name: metadata-bundles
              mountPath: {{ .Values.actionRuntime.config.dataDir }}/metadata-bundles
            - name: keys
              mountPath: {{ .Values.actionRuntime.config.dataDir }}/keys
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: appliance-logs
          hostPath:
            path: /data/zon/logs
            type: DirectoryOrCreate
        {{- if .Values.actionRuntime.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "appliance-control-plane.actionRuntimeClaimName" . }}
        {{- end }}
        - name: metadata-bundles
          hostPath:
            path: {{ .Values.persistence.metadataBundlesHostPath }}
            type: DirectoryOrCreate
        - name: keys
          secret:
            secretName: {{ .Values.secrets.keysSecretName }}
            # Non-root runtime: key files must be group-readable via fsGroup.
            defaultMode: 0440
            # action-runtime verifies its internal caller token only. Do
            # not mount control-plane session, registry, or archive keys.
            items:
              - key: api_token_pepper.key
                path: api_token_pepper.key
{{- end }}
