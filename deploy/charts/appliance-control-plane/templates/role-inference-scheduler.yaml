{{- if and (eq (include "appliance-control-plane.aceSystemEnabled" .) "true") (has "inference" (.Values.config.enabledCapabilities | default (list))) }}
# The control plane schedules inference lifecycle requests by Kubernetes node
# UID. It may inspect the explicitly labelled manager Services and the target
# Node, but cannot create, alter, or delete inference workloads.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "appliance-control-plane.fullname" . }}-inference-scheduler
  namespace: inference
  labels:
    {{- include "appliance-control-plane.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "appliance-control-plane.fullname" . }}-inference-scheduler
  namespace: inference
  labels:
    {{- include "appliance-control-plane.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "appliance-control-plane.serviceAccountName" . }}
    namespace: {{ include "appliance-control-plane.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "appliance-control-plane.fullname" . }}-inference-scheduler
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "appliance-control-plane.fullname" . }}-inference-scheduler
  labels:
    {{- include "appliance-control-plane.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "appliance-control-plane.fullname" . }}-inference-scheduler
  labels:
    {{- include "appliance-control-plane.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "appliance-control-plane.serviceAccountName" . }}
    namespace: {{ include "appliance-control-plane.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "appliance-control-plane.fullname" . }}-inference-scheduler
{{- end }}
