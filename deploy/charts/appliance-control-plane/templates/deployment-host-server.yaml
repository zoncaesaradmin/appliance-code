{{- if .Values.hostAgent.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "appliance-control-plane.hostAgentName" . }}
  namespace: {{ include "appliance-control-plane.appsNamespace" . }}
  labels:
    {{- include "appliance-control-plane.hostAgentLabels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "appliance-control-plane.hostAgentSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "appliance-control-plane.hostAgentSelectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- include "appliance-control-plane.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.hostAgent.podSecurityContext | nindent 8 }}
      containers:
        - name: appliance-host-agent
          image: {{ required "hostAgent.image.reference is required when hostAgent.enabled=true" .Values.hostAgent.image.reference | quote }}
          imagePullPolicy: {{ .Values.hostAgent.image.pullPolicy }}
          env:
            - name: HOST_AGENT_ADDR
              value: {{ printf "0.0.0.0:%d" (.Values.hostAgent.service.port | int) | quote }}
            - name: HOST_AGENT_SOCKET_PATH
              value: {{ printf "%s/%s" .Values.hostAgent.runtime.socketMountPath .Values.hostAgent.runtime.socketFileName | quote }}
            - name: HOST_AGENT_APPLICATION_LOG_PATH
              value: {{ printf "%s/application.log" .Values.hostAgent.logs.hostPath | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.hostAgent.service.port }}
          securityContext:
            {{- toYaml .Values.hostAgent.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.hostAgent.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: host-agent-runtime
              mountPath: {{ .Values.hostAgent.runtime.socketMountPath }}
              readOnly: true
            - name: host-agent-logs
              mountPath: {{ .Values.hostAgent.logs.hostPath }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: host-agent-runtime
          hostPath:
            path: {{ .Values.hostAgent.runtime.socketHostDir }}
            type: Directory
        - name: host-agent-logs
          hostPath:
            path: {{ .Values.hostAgent.logs.hostPath }}
            type: DirectoryOrCreate
{{- end }}
