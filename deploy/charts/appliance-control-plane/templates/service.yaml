apiVersion: v1
kind: Service
metadata:
  name: {{ include "appliance-control-plane.fullname" . }}
  namespace: {{ include "appliance-control-plane.namespace" . }}
  labels:
    {{- include "appliance-control-plane.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "appliance-control-plane.selectorLabels" . | nindent 4 }}
  ports:
    - name: public
      port: {{ .Values.service.publicPort }}
      targetPort: public
---
# The internal listener (health probes today; metrics later) is a separate
# Service so it can never be reached through the IngressRoute below, which
# only ever references the public Service.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "appliance-control-plane.fullname" . }}-internal
  namespace: {{ include "appliance-control-plane.namespace" . }}
  labels:
    {{- include "appliance-control-plane.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "appliance-control-plane.selectorLabels" . | nindent 4 }}
  ports:
    - name: internal
      port: {{ .Values.service.internalPort }}
      targetPort: internal
{{- if .Values.automationRuntime.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "appliance-control-plane.automationRuntimeName" . }}
  namespace: {{ include "appliance-control-plane.appsNamespace" . }}
  labels:
    {{- include "appliance-control-plane.automationRuntimeLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "appliance-control-plane.automationRuntimeSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.automationRuntime.service.port }}
      targetPort: http
{{- end }}
{{- if .Values.ui.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "appliance-control-plane.uiServiceName" . }}
  namespace: {{ include "appliance-control-plane.appsNamespace" . }}
  labels:
    {{- include "appliance-control-plane.uiLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "appliance-control-plane.uiSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.ui.service.port }}
      targetPort: http
{{- /* IngressRoute lives with controlplane; ExternalName aliases UI when split. */ -}}
{{- if include "appliance-control-plane.appsNamespaced" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "appliance-control-plane.uiServiceName" . }}
  namespace: {{ include "appliance-control-plane.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ include "appliance-control-plane.uiServiceName" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: ui-ingress-alias
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: ExternalName
  externalName: {{ include "appliance-control-plane.serviceDNS" (list (include "appliance-control-plane.uiServiceName" .) (include "appliance-control-plane.appsNamespace" .)) }}
  ports:
    - name: http
      port: {{ .Values.ui.service.port }}
{{- end }}
{{- end }}
