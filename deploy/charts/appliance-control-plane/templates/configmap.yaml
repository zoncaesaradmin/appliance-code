{{- if eq (include "appliance-control-plane.aceSystemEnabled" .) "true" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "appliance-control-plane.fullname" . }}-config
  namespace: {{ include "appliance-control-plane.namespace" . }}
  labels:
    {{- include "appliance-control-plane.labels" . | nindent 4 }}
data:
  APPLIANCE_PROFILE: {{ .Values.config.applianceProfile | quote }}
  APPLIANCE_NAME: {{ .Values.config.applianceName | default "" | quote }}
  APPLIANCE_NODE_IPV4: {{ .Values.config.nodeIPv4 | default "" | quote }}
  APPLIANCE_CANONICAL_ORIGIN: {{ .Values.config.canonicalOrigin | quote }}
  APPLIANCE_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  APPLIANCE_TRUSTED_PROXY_COUNT: {{ .Values.config.trustedProxyCount | quote }}
  APPLIANCE_WORKFLOW_ENGINE: "workflows"
  APPLIANCE_WORKFLOW_INSTANCE_ID: {{ .Values.config.workflowInstanceID | quote }}
  APPLIANCE_WORKFLOW_EXECUTOR_SERVICE_ACCOUNT: {{ .Values.config.workflowExecutorServiceAccount | quote }}
  APPLIANCE_BUILD_CATALOG_JSON: {{ .Values.config.buildCatalog | default dict | toJson | quote }}
  APPLIANCE_CATALOG_JSON: {{ .Values.config.applianceCatalog | default dict | toJson | quote }}
  APPLIANCE_WORKSPACE_PROVISIONER_IMAGE_DIGEST: {{ .Values.config.workspaceProvisionerImageDigest | quote }}
  APPLIANCE_BUILDER_IMAGE_DIGEST: {{ .Values.config.builderImageDigest | quote }}
  APPLIANCE_ARTIFACT_SERVER_BASE_URL: {{ .Values.config.artifactServerBaseURL | quote }}
  APPLIANCE_ARTIFACT_SERVER_ALLOW_FAKE: {{ .Values.config.artifactServerAllowFake | quote }}
  APPLIANCE_SERVICE_REGISTRY_JSON: {{ .Values.config.serviceRegistry | default dict | toJson | quote }}
  APPLIANCE_FILES_ROOT_DIR: {{ .Values.files.rootDir | quote }}
  APPLIANCE_FILES_MAX_UPLOAD_BYTES: {{ printf "%s" .Values.files.maxUploadBytes | quote }}
  APPLIANCE_FILES_TRANSFER_TIMEOUT: {{ .Values.files.transferTimeout | quote }}
  APPLIANCE_DNS_READY_URL: {{ .Values.config.dnsReadyURL | quote }}
  APPLIANCE_DNS_ZONE_NAME: {{ .Values.config.dnsZoneName | default "appliance.internal" | quote }}
  APPLIANCE_DNS_CONFIGMAP_NAMESPACE: {{ .Values.config.dnsConfigMapNamespace | default "dns" | quote }}
  APPLIANCE_DNS_CONFIGMAP_NAME: {{ .Values.config.dnsConfigMapName | default "dns-server-config" | quote }}
  APPLIANCE_DNS_BOOTSTRAP_HOSTNAME: {{ .Values.config.dnsBootstrapHostname | default "" | quote }}
  APPLIANCE_DNS_BOOTSTRAP_IPV4: {{ .Values.config.dnsBootstrapIPv4 | default "" | quote }}
  APPLIANCE_DNS_ALLOW_FAKE_ZONE_SYNC: {{ .Values.config.dnsAllowFakeZoneSync | default false | quote }}
  APPLIANCE_INFERENCE_GATEWAY_BASE_URL: {{ .Values.config.inferenceGatewayBaseURL | quote }}
  APPLIANCE_WORKSPACE_ROOT_DIR: {{ .Values.workspaceStorage.rootDir | quote }}
  APPLIANCE_WORKSPACE_CLAIM_NAME: {{ include "appliance-control-plane.workspaceClaimName" . | quote }}
  APPLIANCE_PUBLIC_ADDR: {{ printf "0.0.0.0:%d" (.Values.service.publicPort | int) | quote }}
  APPLIANCE_INTERNAL_ADDR: {{ printf "0.0.0.0:%d" (.Values.service.internalPort | int) | quote }}
  APPLIANCE_DATA_DIR: {{ .Values.persistence.dataDir | quote }}
  APPLIANCE_AUTOMATION_RUNTIME_BASE_URL: {{ include "appliance-control-plane.automationRuntimeBaseURL" . | quote }}
{{- end }}
{{- if and (eq (include "appliance-control-plane.aceAppsEnabled" .) "true") .Values.automationRuntime.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "appliance-control-plane.automationRuntimeName" . }}-config
  namespace: {{ include "appliance-control-plane.appsNamespace" . }}
  labels:
    {{- include "appliance-control-plane.automationRuntimeLabels" . | nindent 4 }}
data:
  AUTOMATION_RUNTIME_ADDR: {{ printf "0.0.0.0:%d" (.Values.automationRuntime.service.port | int) | quote }}
  AUTOMATION_RUNTIME_DATA_DIR: {{ .Values.automationRuntime.config.dataDir | quote }}
  AUTOMATION_RUNTIME_APPLICATION_LOG_PATH: {{ .Values.automationRuntime.config.applicationLogPath | quote }}
  AUTOMATION_RUNTIME_LOG_LEVEL: {{ .Values.automationRuntime.config.logLevel | quote }}
  AUTOMATION_RUNTIME_READ_HEADER_TIMEOUT: "5s"
  AUTOMATION_RUNTIME_READ_TIMEOUT: "30m"
  AUTOMATION_RUNTIME_WRITE_TIMEOUT: "30m"
  AUTOMATION_RUNTIME_IDLE_TIMEOUT: "60s"
  AUTOMATION_RUNTIME_SHUTDOWN_TIMEOUT: "30s"
  AUTOMATION_RUNTIME_MAX_HEADER_BYTES: "16384"
  AUTOMATION_RUNTIME_AUDIT_RETENTION_DAYS: "365"
{{- end }}
{{- if and (eq (include "appliance-control-plane.aceAppsEnabled" .) "true") .Values.ui.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "appliance-control-plane.uiServiceName" . }}-config
  namespace: {{ include "appliance-control-plane.appsNamespace" . }}
  labels:
    {{- include "appliance-control-plane.uiLabels" . | nindent 4 }}
data:
  APPLIANCE_PROFILE: {{ .Values.config.applianceProfile | quote }}
  APPLIANCE_UI_ADDR: {{ printf "0.0.0.0:%d" (.Values.ui.service.port | int) | quote }}
  APPLIANCE_UI_STATIC_DIR: {{ .Values.ui.config.staticDir | quote }}
  APPLIANCE_UI_LOG_LEVEL: {{ .Values.ui.config.logLevel | quote }}
  APPLIANCE_UI_COOKIE_SECURE: {{ .Values.ui.config.cookieSecure | quote }}
  APPLIANCE_CONTROL_PLANE_BASE_URL: {{ include "appliance-control-plane.uiControlPlaneBaseURL" . | quote }}
  APPLIANCE_CONTROL_PLANE_INTERNAL_BASE_URL: {{ include "appliance-control-plane.uiControlPlaneInternalBaseURL" . | quote }}
{{- end }}
