{{- if eq (include "appliance-control-plane.dnsAdminEnabled" .) "true" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "appliance-control-plane.fullname" . }}-dns
  namespace: {{ .Values.config.dnsConfigMapNamespace | default "dns" | quote }}
  labels:
    {{- include "appliance-control-plane.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ .Values.config.dnsConfigMapName | default "dns-server-config" | quote }}]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "appliance-control-plane.fullname" . }}-dns
  namespace: {{ .Values.config.dnsConfigMapNamespace | default "dns" | quote }}
  labels:
    {{- include "appliance-control-plane.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "appliance-control-plane.serviceAccountName" . }}
    namespace: {{ include "appliance-control-plane.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "appliance-control-plane.fullname" . }}-dns
{{- end }}
