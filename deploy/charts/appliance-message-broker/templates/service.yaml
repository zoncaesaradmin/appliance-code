apiVersion: v1
kind: Service
metadata:
  name: {{ include "appliance-message-broker.fullname" . }}
  labels:
    {{- include "appliance-message-broker.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: {{ include "appliance-message-broker.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: client
      port: {{ .Values.service.port }}
      targetPort: client
