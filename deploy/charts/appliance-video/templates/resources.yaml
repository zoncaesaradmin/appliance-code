{{- if .Values.persistence.hostPath.enabled }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "appliance-video.libraryVolumeName" . }}
  labels:
    {{- include "appliance-video.labels" . | nindent 4 }}
spec:
  capacity:
    storage: {{ .Values.persistence.size | quote }}
  accessModes:
    - {{ .Values.persistence.accessMode }}
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: {{ .Values.persistence.hostPath.path | quote }}
    type: DirectoryOrCreate
  claimRef:
    namespace: {{ include "appliance-video.namespace" . }}
    name: {{ .Values.persistence.claimName }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.persistence.claimName }}
  namespace: {{ include "appliance-video.namespace" . }}
  labels:
    {{- include "appliance-video.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  storageClassName: ""
  volumeName: {{ include "appliance-video.libraryVolumeName" . }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
---
{{- else }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.persistence.claimName }}
  namespace: {{ include "appliance-video.namespace" . }}
  labels:
    {{- include "appliance-video.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  {{- if .Values.persistence.storageClassName }}
  storageClassName: {{ .Values.persistence.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "appliance-video.fullname" . }}
  namespace: {{ include "appliance-video.namespace" . }}
  labels:
    {{- include "appliance-video.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "appliance-video.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: runtime
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "appliance-video.fullname" . }}
  namespace: {{ include "appliance-video.namespace" . }}
  labels:
    {{- include "appliance-video.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "appliance-video.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "appliance-video.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: video-runtime
          image: {{ include "appliance-video.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: runtime
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            # Keep Jellyfin writable paths on emptyDirs under RO rootfs.
            - name: JELLYFIN_DATA_DIR
              value: "/config"
            - name: JELLYFIN_CACHE_DIR
              value: "/cache"
            - name: JELLYFIN_CONFIG_DIR
              value: "/config"
            - name: JELLYFIN_LOG_DIR
              value: "/config/log"
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: runtime
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: runtime
          startupProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: runtime
            failureThreshold: {{ .Values.probes.startupFailureThreshold }}
            periodSeconds: {{ .Values.probes.startupPeriodSeconds }}
          volumeMounts:
            - name: library
              mountPath: /media
            - name: config
              mountPath: /config
            - name: cache
              mountPath: /cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: library
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.claimName }}
        - name: config
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "appliance-video.fullname" . }}-default-deny
  namespace: {{ include "appliance-video.namespace" . }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "appliance-video.fullname" . }}-allow
  namespace: {{ include "appliance-video.namespace" . }}
spec:
  podSelector:
    matchLabels:
      {{- include "appliance-video.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.controlPlaneNamespaceLabel | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.controlPlanePodLabels | nindent 14 }}
      ports:
        - {protocol: TCP, port: {{ .Values.service.targetPort }}}
        - {protocol: TCP, port: {{ .Values.service.port }}}
  egress:
    {{- if .Values.networkPolicy.allowDNSToKubeSystem }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    {{- else }}
    []
    {{- end }}
{{- end }}
