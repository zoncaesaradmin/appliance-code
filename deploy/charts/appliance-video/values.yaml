replicaCount: 1

image:
  repository: registry.local/video-runtime
  # Prefer digest pins at install; tag is a schema fallback when digest is empty.
  tag: "10.10.7"
  digest: ""
  pullPolicy: IfNotPresent

# Installer-injected LAN registry pull credentials (see zonctl image-pull).
imagePullSecrets: []

namespace:
  # Default false: zonctl creates and PSA-labels the video namespace before
  # Helm runs. Setting create=true is only for standalone helm installs
  # where the Namespace object should be release-owned.
  create: false
  name: video

service:
  # ClusterIP for in-cluster control-plane / Traefik proxy; Jellyfin listens on 8096.
  port: 8096
  targetPort: 8096

persistence:
  # Default: host-backed static PV+PVC so Restricted PSA pods mount a PVC
  # (allowed) while the library stays on the host for operator upload.
  # Pod-level hostPath is forbidden under Restricted; do not reintroduce it.
  hostPath:
    enabled: true
    path: /data/zon/video/library
  claimName: library
  storageClassName: ""
  accessMode: ReadWriteOnce
  size: 100Gi

networkPolicy:
  enabled: true
  controlPlaneNamespaceLabel:
    kubernetes.io/metadata.name: ace-system
  controlPlanePodLabels:
    app.kubernetes.io/name: controlplane
  allowDNSToKubeSystem: true

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10008
  runAsGroup: 10008
  fsGroup: 20000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 4Gi

probes:
  port: 8096
  path: /health
  startupFailureThreshold: 60
  startupPeriodSeconds: 2
