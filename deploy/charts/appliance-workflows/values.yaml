# Pinned so every name this chart derives (ServiceAccounts, ConfigMap, RBAC,
# etc.) is a clean "appliance-workflows-*" instead of the doubled
# "appliance-workflows-appliance-workflows-*" that falls out of the default
# "<release-name>-<chart-name>" formula whenever the release is installed as
# "appliance-workflows" (which zonctl always does). Several derived names —
# notably the executor ServiceAccount — are referenced by exact string match
# from appliance-code's control plane (WorkflowExecutorServiceAccount), so this
# is not just cosmetic.
fullnameOverride: "appliance-workflows"
# Deployment / pod name only (ReplicaSet pods → workflow-controller-*).
# Kept separate from fullnameOverride so SA/RBAC names stay stable.
deploymentNameOverride: "workflow-controller"

# Installer-injected LAN registry pull credentials (see zonctl image-pull).
imagePullSecrets: []

namespace:
  create: true
  workflows: workflows
  builds: appliance-builds

image:
  controller:
    repository: localhost/appliance-workflow-controller
    tag: "" # defaults to .Chart.AppVersion; releases should pin by digest
    digest: ""
    pullPolicy: IfNotPresent
  executor:
    repository: quay.io/argoproj/argoexec
    tag: "" # defaults to .Chart.AppVersion; releases should pin by digest
    digest: ""

controller:
  replicas: 1
  logLevel: info
  managedNamespace: ""
  extraArgs: []

config:
  instanceID: appliance
  containerRuntimeExecutor: emissary
  archiveLogs: false

serviceAccount:
  controller:
    create: true
    name: ""
  executor:
    create: true
    name: ""

rbac:
  create: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 20000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

networkPolicy:
  enabled: false
