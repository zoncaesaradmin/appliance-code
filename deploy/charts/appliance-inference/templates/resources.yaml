{{- if .Values.persistence.hostPath.enabled }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "appliance-inference.modelsVolumeName" . }}
  labels:
    {{- include "appliance-inference.labels" . | nindent 4 }}
spec:
  capacity:
    storage: {{ .Values.persistence.size | quote }}
  accessModes:
    - {{ .Values.persistence.accessMode }}
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: {{ .Values.persistence.hostPath.path | quote }}
    type: DirectoryOrCreate
  claimRef:
    namespace: {{ include "appliance-inference.namespace" . }}
    name: {{ .Values.persistence.claimName }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.persistence.claimName }}
  namespace: {{ include "appliance-inference.namespace" . }}
  labels:
    {{- include "appliance-inference.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  storageClassName: ""
  volumeName: {{ include "appliance-inference.modelsVolumeName" . }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
---
{{- else }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.persistence.claimName }}
  namespace: {{ include "appliance-inference.namespace" . }}
  labels:
    {{- include "appliance-inference.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  {{- if .Values.persistence.storageClassName }}
  storageClassName: {{ .Values.persistence.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "appliance-inference.serviceAccountName" . }}
  namespace: {{ include "appliance-inference.namespace" . }}
  labels:
    {{- include "appliance-inference.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "appliance-inference.serviceAccountName" . }}
  namespace: {{ include "appliance-inference.namespace" . }}
  labels:
    {{- include "appliance-inference.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: [{{ include "appliance-inference.engineName" . | quote }}]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: [{{ include "appliance-inference.engineName" . | quote }}]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "appliance-inference.serviceAccountName" . }}
  namespace: {{ include "appliance-inference.namespace" . }}
  labels:
    {{- include "appliance-inference.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "appliance-inference.serviceAccountName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "appliance-inference.serviceAccountName" . }}
    namespace: {{ include "appliance-inference.namespace" . }}
---
{{- if eq .Values.runtime.engine "vllm" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "appliance-inference.fullname" . }}-engine-probe
  namespace: {{ include "appliance-inference.namespace" . }}
  labels:
    {{- include "appliance-inference.labels" . | nindent 4 }}
data:
  list_vllm_archs.py: |
{{ .Files.Get "files/list_vllm_archs.py" | indent 4 }}
  publish.sh: |
    #!/bin/sh
    set -eu
    OUT="/models/.zon/vllm-architectures.json"
    mkdir -p /models/.zon
    python3 /probe/list_vllm_archs.py > "${OUT}.tmp"
    mv "${OUT}.tmp" "${OUT}"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "appliance-inference.fullname" . }}-arch-probe
  namespace: {{ include "appliance-inference.namespace" . }}
  labels:
    {{- include "appliance-inference.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "5"
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "appliance-inference.fullname" . }}-arch-probe
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: probe
          image: {{ include "appliance-inference.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "/probe/publish.sh"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: models
              mountPath: /models
            - name: probe
              mountPath: /probe
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.claimName }}
        - name: probe
          configMap:
            name: {{ include "appliance-inference.fullname" . }}-engine-probe
            defaultMode: 0755
        - name: tmp
          emptyDir: {}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "appliance-inference.fullname" . }}
  namespace: {{ include "appliance-inference.namespace" . }}
  labels:
    {{- include "appliance-inference.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "appliance-inference.selectorLabels" . | nindent 4 }}
  ports:
    - name: openai
      port: {{ .Values.service.port }}
      targetPort: runtime
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "appliance-inference.fullname" . }}
  namespace: {{ include "appliance-inference.namespace" . }}
  labels:
    {{- include "appliance-inference.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "appliance-inference.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "appliance-inference.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "appliance-inference.serviceAccountName" . }}
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: inference-manager
          image: {{ include "appliance-inference.managerImage" . }}
          imagePullPolicy: {{ .Values.managerImage.pullPolicy }}
          ports:
            - name: runtime
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            {{- include "appliance-inference.managerEnv" . | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.managerResources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: runtime
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: runtime
          startupProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: runtime
            failureThreshold: {{ .Values.probes.startupFailureThreshold }}
            periodSeconds: {{ .Values.probes.startupPeriodSeconds }}
          volumeMounts:
            - name: models
              mountPath: /models
            - name: tmp
              mountPath: /tmp
            - name: runtime-home
              mountPath: /home/runtime
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.claimName }}
        - name: tmp
          emptyDir: {}
        - name: runtime-home
          emptyDir: {}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "appliance-inference.fullname" . }}-default-deny
  namespace: {{ include "appliance-inference.namespace" . }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "appliance-inference.fullname" . }}-manager
  namespace: {{ include "appliance-inference.namespace" . }}
spec:
  podSelector:
    matchLabels:
      {{- include "appliance-inference.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.controlPlaneNamespaceLabel | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.controlPlanePodLabels | nindent 14 }}
      ports:
        - {protocol: TCP, port: {{ .Values.service.targetPort }}}
        - {protocol: TCP, port: {{ .Values.service.port }}}
    {{- if .Values.openWebUI.enabled }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: open-webui
              {{- include "appliance-inference.selectorLabels" . | nindent 14 }}
      ports:
        - {protocol: TCP, port: {{ .Values.service.targetPort }}}
        - {protocol: TCP, port: {{ .Values.service.port }}}
    {{- end }}
  egress:
    # Engine OpenAI backend inside this namespace.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "appliance-inference.engineName" . }}
      ports:
        - {protocol: TCP, port: {{ .Values.engine.servicePort }}}
    # Kubernetes API for on-demand engine Deployment apply/delete.
    - ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 6443}
    {{- if .Values.networkPolicy.allowDNSToKubeSystem }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    {{- end }}
    {{- if .Values.networkPolicy.allowModelDownloadHTTPS }}
    - ports:
        - {protocol: TCP, port: 443}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "appliance-inference.fullname" . }}-engine
  namespace: {{ include "appliance-inference.namespace" . }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "appliance-inference.engineName" . }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "appliance-inference.selectorLabels" . | nindent 14 }}
      ports:
        - {protocol: TCP, port: {{ .Values.engine.servicePort }}}
  # Ollama /api/pull runs in the engine pod (manager only proxies the request).
  # Without DNS+HTTPS here, registry.ollama.ai lookups time out under default-deny.
  {{- if or .Values.networkPolicy.allowDNSToKubeSystem .Values.networkPolicy.allowModelDownloadHTTPS }}
  egress:
    {{- if .Values.networkPolicy.allowDNSToKubeSystem }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    {{- end }}
    {{- if .Values.networkPolicy.allowModelDownloadHTTPS }}
    - ports:
        - {protocol: TCP, port: 443}
    {{- end }}
  {{- else }}
  egress: []
  {{- end }}
{{- end }}
