{{- if .Values.persistence.hostPath.enabled }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "appliance-inference.modelsVolumeName" . }}
  labels:
    {{- include "appliance-inference.labels" . | nindent 4 }}
spec:
  capacity:
    storage: {{ .Values.persistence.size | quote }}
  accessModes:
    - {{ .Values.persistence.accessMode }}
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: {{ .Values.persistence.hostPath.path | quote }}
    type: DirectoryOrCreate
  claimRef:
    namespace: {{ include "appliance-inference.namespace" . }}
    name: {{ .Values.persistence.claimName }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.persistence.claimName }}
  namespace: {{ include "appliance-inference.namespace" . }}
  labels:
    {{- include "appliance-inference.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  storageClassName: ""
  volumeName: {{ include "appliance-inference.modelsVolumeName" . }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
---
{{- else }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.persistence.claimName }}
  namespace: {{ include "appliance-inference.namespace" . }}
  labels:
    {{- include "appliance-inference.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  {{- if .Values.persistence.storageClassName }}
  storageClassName: {{ .Values.persistence.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
---
{{- end }}
{{- if eq .Values.runtime.engine "vllm" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "appliance-inference.fullname" . }}-engine-launcher
  namespace: {{ include "appliance-inference.namespace" . }}
  labels:
    {{- include "appliance-inference.labels" . | nindent 4 }}
data:
  run.sh: |
    #!/bin/sh
    set -eu
    CONTROL="${INFERENCE_CONTROL_DIR:-/control}"
    CHILD=""
    LAST=""
    cleanup() {
      if [ -n "${CHILD}" ]; then
        kill "${CHILD}" 2>/dev/null || true
        wait "${CHILD}" 2>/dev/null || true
        CHILD=""
      fi
    }
    trap cleanup EXIT INT TERM
    while true; do
      GEN="$(cat "${CONTROL}/generation" 2>/dev/null || true)"
      if [ -n "${GEN}" ] && [ -f "${CONTROL}/argv.json" ] && [ "${GEN}" != "${LAST}" ]; then
        cleanup
        LAST="${GEN}"
        python3 -c 'import json,os,sys; args=json.load(open(sys.argv[1],encoding="utf-8")); os.execvp(args[0], args)' "${CONTROL}/argv.json" &
        CHILD="$!"
      elif [ -z "${GEN}" ]; then
        cleanup
        LAST=""
      fi
      if [ -n "${CHILD}" ] && ! kill -0 "${CHILD}" 2>/dev/null; then
        wait "${CHILD}" 2>/dev/null || true
        CHILD=""
      fi
      sleep 1
    done
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "appliance-inference.fullname" . }}
  namespace: {{ include "appliance-inference.namespace" . }}
  labels:
    {{- include "appliance-inference.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "appliance-inference.selectorLabels" . | nindent 4 }}
  ports:
    - name: openai
      port: {{ .Values.service.port }}
      targetPort: runtime
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "appliance-inference.fullname" . }}
  namespace: {{ include "appliance-inference.namespace" . }}
  labels:
    {{- include "appliance-inference.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "appliance-inference.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "appliance-inference.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- if .Values.gpu.enabled }}
      runtimeClassName: {{ .Values.gpu.runtimeClassName | quote }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: inference-manager
          image: {{ include "appliance-inference.managerImage" . }}
          imagePullPolicy: {{ .Values.managerImage.pullPolicy }}
          ports:
            - name: runtime
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            {{- include "appliance-inference.managerEnv" . | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.managerResources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: runtime
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: runtime
          startupProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: runtime
            failureThreshold: {{ .Values.probes.startupFailureThreshold }}
            periodSeconds: {{ .Values.probes.startupPeriodSeconds }}
          volumeMounts:
            - name: models
              mountPath: /models
            - name: tmp
              mountPath: /tmp
            - name: runtime-home
              mountPath: /home/runtime
            {{- if eq .Values.runtime.engine "vllm" }}
            - name: control
              mountPath: /control
            {{- end }}
        - name: inference-engine
          image: {{ include "appliance-inference.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if eq .Values.runtime.engine "ollama" }}
          command: ["ollama", "serve"]
          {{- else if eq .Values.runtime.engine "vllm" }}
          command: ["/bin/sh", "/launcher/run.sh"]
          {{- end }}
          env:
            {{- include "appliance-inference.engineEnv" . | nindent 12 }}
            {{- if .Values.gpu.enabled }}
            - name: NVIDIA_VISIBLE_DEVICES
              value: {{ .Values.gpu.visibleDevices | quote }}
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: {{ .Values.gpu.driverCapabilities | quote }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: models
              mountPath: /models
            - name: tmp
              mountPath: /tmp
            - name: runtime-home
              mountPath: /home/runtime
            {{- if eq .Values.runtime.engine "vllm" }}
            - name: control
              mountPath: /control
            - name: launcher
              mountPath: /launcher
              readOnly: true
            - name: shared-memory
              mountPath: /dev/shm
            {{- end }}
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.claimName }}
        - name: tmp
          emptyDir: {}
        - name: runtime-home
          emptyDir: {}
        {{- if eq .Values.runtime.engine "vllm" }}
        - name: control
          emptyDir: {}
        - name: launcher
          configMap:
            name: {{ include "appliance-inference.fullname" . }}-engine-launcher
            defaultMode: 0755
        - name: shared-memory
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.runtime.sharedMemorySize }}
        {{- end }}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "appliance-inference.fullname" . }}-default-deny
  namespace: {{ include "appliance-inference.namespace" . }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "appliance-inference.fullname" . }}-allow
  namespace: {{ include "appliance-inference.namespace" . }}
spec:
  podSelector:
    matchLabels:
      {{- include "appliance-inference.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.controlPlaneNamespaceLabel | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.controlPlanePodLabels | nindent 14 }}
      ports:
        - {protocol: TCP, port: {{ .Values.service.targetPort }}}
        - {protocol: TCP, port: {{ .Values.service.port }}}
  {{- if and (not .Values.networkPolicy.allowDNSToKubeSystem) (not .Values.networkPolicy.allowModelDownloadHTTPS) }}
  egress: []
  {{- else }}
  egress:
    {{- if .Values.networkPolicy.allowDNSToKubeSystem }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    {{- end }}
    {{- if .Values.networkPolicy.allowModelDownloadHTTPS }}
    - ports:
        - {protocol: TCP, port: 443}
    {{- end }}
  {{- end }}
{{- end }}
