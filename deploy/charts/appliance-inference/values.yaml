# inference: manager stays up; engine Deployment is created on Load
# (docker-run semantics via Kubernetes). Gateway Service stays stable.
replicaCount: 1

runtime:
  engine: ollama
  # Conservative defaults for small standard validation models. These are
  # runtime settings, not a hardware or model allow-list.
  cpuKVCacheSpaceGiB: 2
  sharedMemorySize: 4Gi

engine:
  # In-cluster Service the manager proxies OpenAI traffic to after Load.
  serviceName: inference-engine
  servicePort: 8001
  # Optional absolute ceiling. Empty = host-derived budget only (recommended).
  # Set only for lab hosts that must refuse models above a fixed package cap.
  maxMemory: ""
  # Optional CPU pin. Empty = plan from host CPUs at Load (recommended).
  # When set, both limit and request are applied as a lab override.
  cpuLimit: ""
  cpuRequest: ""
  # emptyDir /dev/shm for vLLM (counts against the engine memory limit).
  sharedMemorySize: 4Gi

gpu:
  enabled: false
  runtimeClassName: nvidia
  visibleDevices: all
  driverCapabilities: all

image:
  repository: registry.local/inference-runtime
  # Prefer digest pins at install; tag is a schema fallback when digest is empty.
  tag: "0.17.1"
  digest: ""
  pullPolicy: IfNotPresent

managerImage:
  repository: registry.local/inference-manager
  tag: "0.17.1"
  digest: ""
  pullPolicy: IfNotPresent

# Open WebUI is opt-in and is only enabled by a delivery pack that supplies
# both digest-pinned images. It has no Ingress here: the appliance session
# bridge will own the public route once its launch-grant API is implemented.
openWebUI:
  enabled: false
  image:
    repository: registry.local/open-webui
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  gatewayImage:
    repository: registry.local/open-webui-gateway
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  service:
    port: 8080
  gatewayService:
    port: 8081
  persistence:
    claimName: open-webui-data
    storageClassName: ""
    accessMode: ReadWriteOnce
    size: 10Gi

# Installer-injected LAN registry pull credentials (see zonctl image-pull).
imagePullSecrets: []

namespace:
  # Default false: zonctl creates and PSA-labels the inference namespace before
  # Helm runs. Setting create=true is only for standalone helm installs
  # where the Namespace object should be release-owned.
  create: false
  name: inference

service:
  # ClusterIP for in-cluster control-plane proxy; manager listens on 11434.
  port: 8080
  targetPort: 11434

persistence:
  # Default: host-backed static PV+PVC so Restricted PSA pods mount a PVC
  # (allowed) while models stay on the host for zonctl models-import.
  # Pod-level hostPath is forbidden under Restricted; do not reintroduce it.
  # Set hostPath.enabled=false for an ordinary StorageClass PVC instead.
  hostPath:
    enabled: true
    path: /data/zon/inference/models
  claimName: models
  storageClassName: ""
  accessMode: ReadWriteOnce
  size: 50Gi

networkPolicy:
  enabled: true
  controlPlaneNamespaceLabel:
    kubernetes.io/metadata.name: ace-system
  controlPlanePodLabels:
    # Matches appliance-control-plane chart selectorLabels:
    # app.kubernetes.io/name=controlplane.
    app.kubernetes.io/name: controlplane
  # DNS is required during the operator-controlled connected window.
  # Applied to both manager (catalog/HF) and engine (Ollama /api/pull).
  allowDNSToKubeSystem: true
  # The operator controls the connected window at the appliance/network edge.
  # HTTPS supports catalog metadata discovery, HF downloads in the manager, and
  # Ollama registry pulls from the engine pod.
  allowModelDownloadHTTPS: true

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10006
  runAsGroup: 10006
  fsGroup: 20000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

openWebUISecurityContext:
  runAsNonRoot: true
  runAsUser: 10011
  runAsGroup: 10011
  fsGroup: 20000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault
# HOME is forced to /home/runtime (emptyDir) in the Deployment: the upstream
# ollama image defaults HOME=/ for numeric UIDs, which fails under
# readOnlyRootFilesystem (mkdir /.ollama).

managerResources:
  # HF snapshot downloads run in this container. 2Gi still OOM-kills mid-fetch
  # on multi-GB models (huggingface_hub peak RSS).
  requests:
    cpu: 50m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 6Gi

probes:
  # Manager exposes a lightweight health endpoint here.
  port: 11434
  path: /
  startupFailureThreshold: 30
  startupPeriodSeconds: 2
