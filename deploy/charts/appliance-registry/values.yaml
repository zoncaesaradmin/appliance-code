replicaCount: 1

image:
  repository: registry.local/artifact-server
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

namespace:
  create: false
  name: artifacts

service:
  port: 5000

persistence:
  storageClassName: ""
  accessMode: ReadWriteOnce
  size: 100Gi

logs:
  # Host-visible OCI registry (artifact-server) log directory. zonctl prepares
  # ownership before Helm apply; the container mounts this same path and the
  # artifact-server process writes application.log there via config
  # log.output. The prepare init container also touches application.log as
  # mode 0644 so host operators can read it (the process would otherwise
  # create the file as 0600).
  hostPath: /data/zon/logs/artifactserver
  prepare:
    enabled: false
    image: registry.local/busybox:bundled

auth:
  # zonctl replaces this portable placeholder with the installed appliance
  # origin. OCI clients require an absolute bearer-token realm.
  realm: https://appliance.example.internal/api/v1/registry/token
  service: artifact-server
  # Public-only verification Secret published by zonctl; never mount appliance-keys.
  publicKeySecretName: appliance-registry-verification-key
  publicKeySecretKey: registry_ed25519_public.pem

ingress:
  enabled: true
  entryPoints: [websecure]
  host: ""
  tlsSecretName: appliance-tls

networkPolicy:
  enabled: true
  traefikNamespaceLabel: {}
  controlPlaneNamespaceLabel:
    kubernetes.io/metadata.name: ace-system
  controlPlanePodLabels:
    # Matches appliance-control-plane chart selectorLabels:
    # app.kubernetes.io/name=controlplane.
    app.kubernetes.io/name: controlplane

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10003
  runAsGroup: 10003
  fsGroup: 20000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 1Gi

probes:
  # OCI token auth commonly challenges unauthenticated /v2/ requests with 401.
  # Use a plain TCP probe so auth configuration does not flap pod health.
  startupFailureThreshold: 30
  startupPeriodSeconds: 2
