replicaCount: 1

image:
  repository: registry.local/coredns
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

namespace:
  # Default false: zonctl creates and PSA-labels the dns namespace before
  # Helm runs. Setting create=true is only for standalone helm installs
  # where the Namespace object should be release-owned.
  create: false
  name: dns

service:
  # ClusterIP for in-cluster diagnostics; LAN clients use hostNetwork :53.
  port: 53

# hostNetwork is required so LAN clients can reach UDP/TCP 53 on the appliance
# node. This is an explicit Pod Security Admission exception for the dns
# namespace only; application containers remain non-root (UID 10004) with
# NET_BIND_SERVICE.
hostNetwork: true
dnsPolicy: ClusterFirstWithHostNet

upstreamResolvers:
  - 1.1.1.1
  - 8.8.8.8

localZone:
  # Use .internal (not .local): systemd-resolved reserves .local for mDNS
  # and never forwards those names to unicast DNS on Ubuntu clients.
  # Product host A records are not chart defaults: the control plane owns
  # db.local via ConfigMap patch from the DNS records API (SOA serial bumps
  # every sync; CoreDNS file-plugin reload 1s serves changes promptly).
  # ipv4 is only NS glue for ns.<zone>; hostname stays empty unless an
  # operator/API write materializes records.
  name: appliance.internal
  hostname: ""
  ipv4: 127.0.0.1

logs:
  # Host-visible DNS service log directory. zonctl prepares ownership before
  # Helm runs. The appliance CoreDNS wrapper tees stdout/stderr into
  # stdout.log / stderr.log under this path (upstream CoreDNS only logs to
  # stdout; the mount alone does not create files).
  hostPath: /data/zon/logs/dns
  prepare:
    enabled: false
    image: registry.local/busybox:bundled

networkPolicy:
  enabled: true
  # hostNetwork pods still get a NetworkPolicy for documentation and
  # in-namespace diagnostics; LAN UDP/TCP 53 arrives via the host stack.
  allowDNSFromAnywhere: true

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10004
  runAsGroup: 10004
  fsGroup: 20000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault
  # Do not set net.ipv4.ip_unprivileged_port_start here: Kubernetes rejects
  # pod sysctls when hostNetwork is true. zonctl hostdns.Prepare applies that
  # sysctl on the node instead so UID 10004 can bind :53 under hostNetwork.

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
    add: ["NET_BIND_SERVICE"]

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: "500m"
    memory: 256Mi

probes:
  healthPort: 8080
  readyPort: 8181
  startupFailureThreshold: 30
  startupPeriodSeconds: 2
